<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Coach — AI Trading Teaching Coach (POC)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0e1620;
    --surface: #152230;
    --surface-2: #1c2f3f;
    --line: #26394a;
    --text: #eaf3f1;
    --text-muted: #8fa8b3;
    --accent: #39d9a4;
    --accent-dim: #1f5e4e;
    --warm: #f0b545;
    --danger: #e56c7d;
    --radius-card: 18px;
    --radius-pill: 999px;
    --radius-input: 12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.serif{ font-family:'Source Serif 4', Georgia, serif; }
  .mono{ font-family:'IBM Plex Mono', monospace; letter-spacing:0.02em; }
  #root{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    background: radial-gradient(ellipse 120% 60% at 50% -10%, #16283158 0%, transparent 60%), var(--bg);
  }
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{ background: var(--accent-dim); color:var(--text); }

  /* ---- status strip ---- */
  .status-strip{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 18px;
    font-size:12.5px;
    color:var(--warm);
    background: #1a1409;
    border-bottom:1px solid #3a2c10;
  }
  .status-strip .dot{ width:6px;height:6px;border-radius:50%;background:var(--warm); display:inline-block; margin-right:7px; box-shadow:0 0 0 3px #f0b54522;}
  .status-strip button{
    background:none;border:none;color:var(--text-muted);font-size:12px;cursor:pointer;text-decoration:underline;
    padding:0;
  }

  /* ---- scroll area ---- */
  .screen{
    flex:1;
    padding: 20px 18px 100px 18px;
    animation: fadein .25s ease;
  }
  .screen.no-tab{ padding-bottom:28px; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .eyebrow-free-title{ font-size:26px; line-height:1.2; margin:2px 0 6px 0; font-weight:600; }
  .subtitle{ color:var(--text-muted); font-size:14.5px; line-height:1.5; margin:0 0 18px 0; }

  /* ---- cards ---- */
  .card{
    background: var(--surface);
    border:1px solid var(--line);
    border-radius: var(--radius-card);
    padding:18px;
    margin-bottom:14px;
  }
  .card.flat{ background:transparent; border:1px dashed var(--line); }
  .card-title{ font-size:15px; font-weight:600; margin:0 0 4px 0; }
  .card-sub{ font-size:13px; color:var(--text-muted); margin:0 0 12px 0; }

  .demo-tag{
    display:inline-flex; align-items:center; gap:6px;
    font-size:10.5px; font-weight:600; color:#0e1620;
    background:var(--warm);
    padding:3px 9px 4px 9px;
    border-radius: var(--radius-pill);
    letter-spacing:0.02em;
  }

  /* ---- buttons ---- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border-radius: var(--radius-input);
    padding:13px 18px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    border:1px solid transparent;
    width:100%;
    transition: transform .08s ease, filter .15s ease;
  }
  .btn:active{ transform: scale(0.98); }
  .btn-primary{ background: var(--accent); color:#06231a; }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-ghost{ background: transparent; color:var(--text); border:1px solid var(--line); }
  .btn-ghost:hover{ border-color:#3c5567; }
  .btn-warm{ background: var(--warm); color:#241a04; }
  .btn-sm{ width:auto; padding:9px 14px; font-size:13.5px; }
  .btn-danger-outline{ background:transparent; border:1px solid var(--danger); color:var(--danger); }
  .btn-row{ display:flex; gap:10px; }
  .btn-row .btn{ flex:1; }

  .choice-list{ display:flex; flex-direction:column; gap:10px; margin:16px 0 6px 0; }
  .choice{
    text-align:left;
    background: var(--surface);
    border:1px solid var(--line);
    border-radius: var(--radius-input);
    padding:14px 16px;
    font-size:14.5px;
    color:var(--text);
    cursor:pointer;
    width:100%;
  }
  .choice:hover{ border-color: var(--accent-dim); }
  .choice.selected{ border-color:var(--accent); background:#16302826; box-shadow: inset 0 0 0 1px var(--accent); }
  .choice .label{ font-weight:600; display:block; }
  .choice .desc{ color:var(--text-muted); font-size:12.5px; margin-top:2px; display:block;}

  /* ---- progress ---- */
  .progress-track{
    height:8px; border-radius:5px; background:var(--surface-2); overflow:hidden;
  }
  .progress-fill{ height:100%; background: linear-gradient(90deg, var(--accent-dim), var(--accent)); border-radius:5px; transition: width .4s ease; }
  .step-dots{ display:flex; gap:6px; margin-bottom:22px; }
  .step-dots span{ height:4px; flex:1; border-radius:2px; background:var(--surface-2); }
  .step-dots span.done{ background: var(--accent); }

  /* ---- inputs ---- */
  label.field-label{ font-size:12.5px; color:var(--text-muted); display:block; margin:12px 0 6px 0; }
  label.field-label:first-child{ margin-top:0; }
  input[type=text], input[type=number], textarea, select{
    width:100%;
    background: var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius: var(--radius-input);
    padding:12px 13px;
    font-size:15px;
    font-family:inherit;
  }
  input:focus, textarea:focus, select:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
  textarea{ resize:vertical; min-height:70px; }
  .field-row{ display:flex; gap:10px; }
  .field-row > div{ flex:1; }
  .seg{ display:flex; border:1px solid var(--line); border-radius:var(--radius-input); overflow:hidden; }
  .seg button{ flex:1; padding:11px; background:var(--surface-2); color:var(--text-muted); border:none; font-size:14px; font-weight:600; cursor:pointer;}
  .seg button.active{ background:var(--accent); color:#06231a; }

  /* ---- tabs (segmented sub-nav within a section) ---- */
  .subtabs{ display:flex; gap:8px; margin-bottom:16px; }
  .subtabs button{
    flex:1; padding:10px; border-radius:var(--radius-pill); border:1px solid var(--line);
    background:transparent; color:var(--text-muted); font-size:13px; font-weight:600; cursor:pointer;
  }
  .subtabs button.active{ background:var(--surface-2); color:var(--text); border-color:#3c5567; }

  /* ---- stat grid ---- */
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat-box{ background:var(--surface-2); border-radius:14px; padding:12px 14px; }
  .stat-box .num{ font-size:20px; font-weight:700; font-family:'IBM Plex Mono',monospace; }
  .stat-box .lbl{ font-size:11.5px; color:var(--text-muted); margin-top:2px; }
  .pos{ color:var(--accent); } .neg{ color:var(--danger); }

  /* ---- dividers/section labels (sentence case, not shouting) ---- */
  .section-label{ font-size:13px; color:var(--text-muted); margin:22px 0 10px 0; font-weight:600; }
  .section-label:first-child{ margin-top:0; }

  /* ---- bottom nav ---- */
  .tabbar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px;
    background: rgba(21,34,48,0.92);
    backdrop-filter: blur(10px);
    border-top:1px solid var(--line);
    display:flex;
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom)) 6px;
    z-index:20;
  }
  .tabbar button{
    flex:1; background:none; border:none; color:var(--text-muted);
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:10.5px; padding:6px 2px; cursor:pointer; border-radius:10px;
  }
  .tabbar button.active{ color: var(--accent); }
  .tabbar .icon{ font-size:19px; line-height:1; }

  /* ---- chat / teacher bubbles ---- */
  .bubble{ border-radius:16px; padding:13px 15px; margin-bottom:10px; font-size:14.5px; line-height:1.5; max-width:92%; }
  .bubble.coach{ background:var(--surface-2); border:1px solid var(--line); border-top-left-radius:4px; }
  .bubble.user{ background: var(--accent-dim); color:#dff7ec; margin-left:auto; border-top-right-radius:4px; }
  .coach-name{ font-size:11.5px; color:var(--accent); font-weight:700; margin-bottom:6px; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .chip{
    border:1px solid var(--line); background:var(--surface); color:var(--text);
    border-radius:var(--radius-pill); padding:9px 14px; font-size:13px; cursor:pointer; font-weight:500;
  }
  .chip:hover{ border-color: var(--accent); }
  .chip.warm{ border-color:#5c481c; color:var(--warm); }

  .kv{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .kv:last-child{ border-bottom:none; }
  .kv .k{ color:var(--text-muted); }
  .kv .v{ font-weight:600; font-family:'IBM Plex Mono',monospace; }

  .badge{ display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:var(--radius-pill); background:var(--surface-2); color:var(--text-muted); }
  .badge.level-current{ background: var(--accent-dim); color:var(--accent); }
  .badge.level-done{ background:#1c2f3f; color:var(--accent); }

  .framework-step{ display:flex; gap:10px; margin-bottom:10px; }
  .framework-step .n{ width:22px;height:22px;border-radius:50%;background:var(--surface-2); color:var(--accent); font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; font-family:'IBM Plex Mono',monospace;}
  .framework-step .body b{ display:block; font-size:13px; margin-bottom:2px; }
  .framework-step .body p{ margin:0; font-size:13px; color:var(--text-muted); line-height:1.5; }

  .tag-fact{color:#7fd8ff;} .tag-interp{color:var(--warm);} .tag-assume{color:#c893ff;} .tag-scenario{color:var(--accent);}

  .trade-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; }
  .trade-card .row1{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .trade-card .ticker{ font-weight:700; font-size:15px; }
  .trade-card .result{ font-family:'IBM Plex Mono',monospace; font-weight:700; }

  .star-row{ display:flex; gap:6px; font-size:26px; }
  .star-row span{ cursor:pointer; filter:grayscale(1) opacity(0.4); }
  .star-row span.on{ filter:none; }

  .empty-state{ text-align:center; padding:36px 12px; color:var(--text-muted); }
  .empty-state .glyph{ font-size:30px; margin-bottom:10px; }

  .checklist-item{ display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line); }
  .checklist-item:last-child{ border-bottom:none; }
  .checklist-item .mark{ font-size:15px; margin-top:1px; }
  .checklist-item .mark.yes{ color:var(--accent); }
  .checklist-item .mark.no{ color:var(--danger); }
  .checklist-item .mark.neutral{ color:var(--text-muted); }

  .top-back{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .top-back button{ background:var(--surface-2); border:1px solid var(--line); color:var(--text); width:34px;height:34px;border-radius:10px; cursor:pointer; font-size:16px;}
  .top-back .ttl{ font-weight:600; font-size:15.5px; }

  .warn-box{ background:#2a1a10; border:1px solid #5c3a1c; color:#f2c48a; border-radius:12px; padding:12px 14px; font-size:13px; line-height:1.5; margin-top:10px; }

  /* ---- in-app modal (replaces native alert/confirm) ---- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(8,13,18,0.72); display:flex; align-items:center; justify-content:center; z-index:100; padding:24px; }
  .modal-box{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:20px; max-width:400px; width:100%; }
  .modal-box .modal-title{ font-weight:700; font-size:16px; margin-bottom:8px; }
  .modal-box .modal-msg{ font-size:14px; line-height:1.55; color:var(--text-muted); margin-bottom:18px; white-space:pre-line; }

  /* ---- collapsible analyzer sections ---- */
  details.card{ padding:0; overflow:hidden; }
  details.card summary{ list-style:none; cursor:pointer; padding:18px; font-size:15px; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
  details.card summary::-webkit-details-marker{ display:none; }
  details.card summary::after{ content:"▾"; color:var(--text-muted); transition:transform .15s ease; font-size:12px; }
  details.card[open] summary::after{ transform:rotate(180deg); }
  details.card .details-body{ padding:0 18px 18px 18px; }

  .info-dot{ display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px; border-radius:50%; background:var(--surface-2); color:var(--text-muted); font-size:10px; font-style:normal; cursor:pointer; margin-left:4px; vertical-align:middle; }
  .ok-box{ background:#0e2a22; border:1px solid #1f5e4e; color:#a9f0d6; border-radius:12px; padding:12px 14px; font-size:13px; line-height:1.5; margin-top:10px; }

  /* ---- confidence / explainability ---- */
  .factor-row{ display:flex; gap:9px; align-items:flex-start; padding:7px 0; font-size:13px; line-height:1.5; border-bottom:1px solid var(--line); }
  .factor-row:last-child{ border-bottom:none; }
  .factor-row .arrow{ font-family:'IBM Plex Mono',monospace; font-weight:700; width:14px; flex-shrink:0; text-align:center; margin-top:1px; }
  .factor-row.up .arrow{ color:var(--accent); }
  .factor-row.down .arrow{ color:var(--danger); }
  .factor-row.neutral .arrow{ color:var(--text-muted); }
  .confidence-meter{ height:10px; border-radius:6px; background:var(--surface-2); overflow:hidden; margin:10px 0 4px 0; }
  .confidence-fill{ height:100%; border-radius:6px; }

  /* ---- quality / status pills ---- */
  .quality-pill{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:var(--radius-pill); }
  .quality-pill.good{ background:#0e2a22; color:var(--accent); }
  .quality-pill.fair{ background:#2a2410; color:var(--warm); }
  .quality-pill.limited{ background:#2a1a10; color:#f2c48a; }

  /* ---- fundamentals mini-bars ---- */
  .fund-row{ display:flex; align-items:center; gap:10px; padding:6px 0; }
  .fund-row .flabel{ width:92px; flex-shrink:0; font-size:12.5px; color:var(--text-muted); }
  .fund-row .fbar{ flex:1; height:7px; border-radius:4px; background:var(--surface-2); overflow:hidden; }
  .fund-row .fbar > div{ height:100%; background:linear-gradient(90deg, var(--accent-dim), var(--accent)); border-radius:4px; }
  .fund-row .fnum{ width:28px; text-align:right; font-family:'IBM Plex Mono',monospace; font-size:12px; flex-shrink:0; }

  /* ---- alerts ---- */
  .alert-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; }
  .alert-card.triggered{ border-color:#5c481c; background:#1a1409; }
  .alert-card .row1{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .alert-card .ticker{ font-weight:700; font-size:15px; }

  /* ---- decision log ---- */
  .decision-row{ display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--line); gap:10px; }
  .decision-row:last-child{ border-bottom:none; }
  .decision-row .dmeta{ font-size:12px; color:var(--text-muted); margin-top:2px; }
</style>
</head>

<script>
/* ============================= DATA ============================= */

const TOPICS = {
  what_is_a_stock: {
    keywords: ["what is a stock", "what's a stock", "define a stock", "define stock", "stock mean"],
    title: "What is a stock?",
    level: "Absolute basics",
    instrument: "universal",
    explain: {
      new: "A stock is a small ownership slice of a company. When you buy one share, you own a tiny piece of that business — if the company does well and becomes more valuable, your share is usually worth more too. If it struggles, your share can be worth less. The price moves because buyers and sellers are constantly agreeing on what that slice is worth right now.",
      inter: "Stock price reflects the market's constantly shifting collective estimate of a company's future cash flows and risk, not a fixed 'true value' — that's why prices move even when nothing about the actual business changed today."
    },
    socratic: "If you own 1 share of a company with 1,000,000 shares total, roughly what percentage of the company do you own?",
    socraticFollowup: "0.0001% — a tiny sliver. That's why owning a few shares doesn't give you control over the company, but you still benefit if the company's total value grows.",
    example: "A company is valued at $1 billion and has 100 million shares outstanding. Each share represents $10 of that value ($1B ÷ 100M). If the company's total value grows to $1.2 billion with no new shares issued, each share is now worth about $12.",
    quiz: [
      { q: "What does owning a share of stock represent?", options: ["A small ownership stake in a company", "A loan you've given the company that must be repaid", "A coupon for discounted products from that company"], correct: 0, feedback: "Right — a share is ownership, not a loan (that's what a bond is)." },
      { q: "Why does a stock's price change from day to day even if the company hasn't announced any news?", options: ["Buyers and sellers are continuously re-agreeing on what the company is worth", "Stock prices only change once a year", "Prices are set entirely by the company itself"], correct: 0, feedback: "Correct — price is a constantly updating negotiation between buyers and sellers, not a fixed number the company sets." },
      { q: "A company is worth $500 million and has 50 million shares. What is each share theoretically worth?", options: ["$10", "$100", "$1"], correct: 0, feedback: "$500M ÷ 50M shares = $10 per share." },
      { q: "If a company's total value doubles and no new shares are issued, what happens to the price per share?", options: ["It roughly doubles too", "It stays exactly the same", "It's cut in half"], correct: 0, feedback: "Right — with the same number of shares splitting a bigger pie, each slice is worth more." },
      { q: "Does owning a few shares of a company typically give you control over its decisions?", options: ["No — meaningful control usually requires owning a large percentage of shares", "Yes, any shareholder can direct company decisions", "Yes, but only on weekends"], correct: 0, feedback: "Correct — most individual shareholders own too small a slice to influence company decisions directly." },
      { q: "What is the more accurate way to think about a stock's price?", options: ["The market's current collective estimate of the company's value, which can change constantly", "A fixed price set once when the company started", "A number that only changes once per year at earnings"], correct: 0, feedback: "Right — it's a constantly updating estimate, not a fixed figure." }
    ],
    challenge: "Pick a company you know well. Look up roughly how many shares it has outstanding and its current share price. Multiply them together — that's the market's current estimate of what the whole company is worth."
  },
  order_types: {
    keywords: ["market order", "limit order", "order type"],
    title: "Market orders vs. limit orders",
    level: "Absolute basics",
    instrument: "universal",
    explain: {
      new: "A market order says 'buy or sell right now, at whatever the current price is.' It fills almost instantly but you don't control the exact price you get. A limit order says 'only buy or sell at this specific price or better.' You control the price, but there's no guarantee it fills at all if the market never reaches your number.",
      inter: "Market orders prioritize certainty of execution over price; limit orders prioritize price control over certainty of execution — the choice between them is really a choice about which kind of certainty matters more for a given trade."
    },
    socratic: "If you place a limit order to buy a stock at $50, and the stock is currently trading at $55 and never drops to $50, what happens to your order?",
    socraticFollowup: "It simply never fills — it just sits there waiting. That's the trade-off: you got exact price control, but no guarantee of ever actually owning the stock.",
    example: "A stock is trading at $100.05. A market order to buy fills almost immediately, maybe at $100.06 or $100.08 depending on how fast the price is moving. A limit order to buy at $99.50 won't fill at all unless the price actually drops to $99.50 or lower.",
    quiz: [
      { q: "What does a market order guarantee?", options: ["That it will execute quickly, but not at a specific price", "An exact price, but no guarantee of when it fills", "Both an exact price and immediate execution"], correct: 0, feedback: "Right — market orders trade price certainty for execution speed." },
      { q: "What does a limit order guarantee?", options: ["A specific price or better, but not that it will fill at all", "Immediate execution no matter what", "A better price than a market order, always"], correct: 0, feedback: "Correct — you set the price, but the market has to actually reach it for the order to execute." },
      { q: "You place a limit order to sell at $60. The stock never rises above $58. What happens?", options: ["The order never fills", "It fills automatically at $58", "It fills at $60 regardless of the stock's actual price"], correct: 0, feedback: "Right — a sell limit only fills at your price or higher, and the stock never got there." },
      { q: "Why might a trader prefer a market order over a limit order?", options: ["When getting in or out immediately matters more than the exact price", "Market orders are always cheaper to place", "Market orders guarantee the best possible price"], correct: 0, feedback: "Correct — speed and certainty of execution is the trade-off market orders are built for." },
      { q: "Why might a trader prefer a limit order over a market order?", options: ["To control the exact price paid or received, accepting the order might not fill", "Limit orders always execute faster than market orders", "Limit orders are required by law for beginners"], correct: 0, feedback: "Right — price control is the entire point of a limit order." },

/* Links a Teacher topic (with a real quiz) to the specific Learning Path checklist
   slot(s) it verifies. Topics not listed here have no quiz-backed verification yet
   and stay manually self-checked on the Learning Path. */
const TOPIC_LEVEL_MAP = {
  what_is_a_stock: [{ level:1, index:0 }],
  order_types: [{ level:1, index:1 }, { level:1, index:2 }],
  candlesticks: [{ level:1, index:3 }],
  timeframes: [{ level:1, index:4 }],
  support_resistance: [{ level:2, index:1 }],
  momentum_volume: [{ level:2, index:2 }, { level:2, index:3 }],
  risk_management: [{ level:3, index:0 }],
  psychology_fomo: [{ level:5, index:0 }],
};

function findTopicForLevelSlot(levelId, index){
  for(const [key, slots] of Object.entries(TOPIC_LEVEL_MAP)){
    if(slots.some(s=>s.level===levelId && s.index===index)) return key;
  }
  return null;
}

function orderedTopicKeys(){
  const universal = ["what_is_a_stock","order_types","timeframes","risk_management","support_resistance","candlesticks","momentum_volume","psychology_fomo"];
  const specialty = [];
  if(state.profile.instruments.includes("options")) specialty.push("options_basics","options_strategies");
  if(state.profile.instruments.includes("futures")) specialty.push("futures_basics");
  if(state.profile.instruments.includes("crypto")) specialty.push("crypto_basics");
  return [...universal, ...specialty];
}

function isMastered(topicKey){
  return !!(state.topicMastery[topicKey] && state.topicMastery[topicKey].mastered);
}

/* ---- Adaptive quiz engine ----
   Each topic now has a real question bank (6 per topic). Mastery means every
   question in the bank has been answered correctly at least once — not
   necessarily all in the same sitting. Every session pulls whatever hasn't
   been answered correctly yet first, so wrong (or unseen) answers directly
   determine what you're tested on next, and right answers you've already
   proven don't keep getting repeated ahead of what you actually need. */
function selectQuizSession(topicKey, maxSize=4){
  const bank = TOPICS[topicKey].quiz;
  const stats = state.quizStats[topicKey] || {};
  const notYetCorrect = [], alreadyCorrect = [];
  bank.forEach((q,i)=>{
    if(stats[i] && stats[i].correct===true) alreadyCorrect.push(i);
    else notYetCorrect.push(i);
  });
  const shuffle = (arr) => arr.map(v=>({v,r:Math.random()})).sort((a,b)=>a.r-b.r).map(x=>x.v);
  const ordered = [...shuffle(notYetCorrect), ...shuffle(alreadyCorrect)];
  const size = Math.min(maxSize, bank.length);
  return ordered.slice(0, size).map(i => ({ ...bank[i], _bankIndex: i }));
}

function countCorrectInBank(topicKey){
  const bank = TOPICS[topicKey].quiz;
  const stats = state.quizStats[topicKey] || {};
  return bank.filter((_,i)=> stats[i] && stats[i].correct===true).length;
}

function recordQuizAnswer(topicKey, bankIndex, wasCorrect){
  if(!state.quizStats[topicKey]) state.quizStats[topicKey] = {};
  state.quizStats[topicKey][bankIndex] = { correct: wasCorrect };
  const bank = TOPICS[topicKey].quiz;
  if(countCorrectInBank(topicKey) === bank.length){
    if(!state.topicMastery[topicKey]) state.topicMastery[topicKey] = { mastered:false, attempts:0 };
    if(!state.topicMastery[topicKey].mastered){
      state.topicMastery[topicKey].mastered = true;
      (TOPIC_LEVEL_MAP[topicKey] || []).forEach(s=>{ state.levelsComplete[s.level+"-"+s.index] = true; });
    }
  }
}

function recordQuizAttempt(topicKey, passed){
  if(!state.topicMastery[topicKey]) state.topicMastery[topicKey] = { mastered:false, attempts:0 };
  state.topicMastery[topicKey].attempts++;
  if(passed){
    state.topicMastery[topicKey].mastered = true;
    (TOPIC_LEVEL_MAP[topicKey] || []).forEach(s=>{ state.levelsComplete[s.level+"-"+s.index] = true; });
  }
}

function nextUnmasteredTopic(currentKey){
  const order = orderedTopicKeys();
  const idx = order.indexOf(currentKey);
  for(let i=1; i<=order.length; i++){
    const candidate = order[(idx+i+order.length) % order.length];
    if(candidate!==currentKey && !isMastered(candidate)) return candidate;
  }
  return null; // every topic mastered
}

/* ---- Full app persistence ----
   Originally only the streak used localStorage. Extending that same reasoning
   to the whole profile/progress/journal: this only runs as a real hosted
   webpage (Netlify etc.), not Claude's inline artifact sandbox, so browser
   storage is genuinely safe here — and "why do I have to redo my profile
   every time" is a real complaint worth fixing now rather than waiting on
   the full Supabase backend. Only durable data is saved — transient UI state
   (which screen you're on, open forms, in-flight loading) is never persisted,
   so a reload always lands on a clean Home screen, never a stuck form. */
const APP_STATE_KEY = "tc_appstate_v1";

function loadPersistedState(){
  try {
    const raw = localStorage.getItem(APP_STATE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e){
    return null;
  }
}

function persistState(){
  try {
    const toSave = {
      profile: state.profile,
      levelsComplete: state.levelsComplete,
      topicMastery: state.topicMastery,
      quizStats: state.quizStats,
      trades: state.trades,
      portfolio: state.portfolio,
      alerts: state.alerts,
      decisionLog: state.decisionLog,
      communityIdeas: state.communityIdeas,
      feedback: state.feedback,
      hasAnalyzed: state.hasAnalyzed,
      hasBuiltPlan: state.hasBuiltPlan,
      hasOpenedTrade: state.hasOpenedTrade,
      hasVisitedCommunity: state.hasVisitedCommunity,
    };
    localStorage.setItem(APP_STATE_KEY, JSON.stringify(toSave));
  } catch(e){ /* storage unavailable — fail silently, same handling as the streak */ }
}

const STREAK_KEY = "tc_streak_v1";

function loadStreakData(){
  try {
    const raw = localStorage.getItem(STREAK_KEY);
    if(!raw) return { lastVisit:null, streak:0, longestStreak:0, totalDaysUsed:0 };
    return JSON.parse(raw);
  } catch(e){
    return { lastVisit:null, streak:0, longestStreak:0, totalDaysUsed:0 };
  }
}

function saveStreakData(data){
  try { localStorage.setItem(STREAK_KEY, JSON.stringify(data)); } catch(e){ /* storage unavailable — fail silently, streak just won't persist */ }
}

/* Uses the LOCAL calendar day, not UTC — using toISOString() here would
   silently miscount streak days for anyone outside UTC (found during testing:
   a Pacific-time user visiting late Monday night and again Tuesday morning
   would have both visits collapse into the same UTC date and lose a day). */
function localDateStr(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function updateStreakOnLoad(){
  const today = localDateStr(new Date());
  const data = loadStreakData();
  if(data.lastVisit === today) return data; // already counted today
  const yesterday = localDateStr(new Date(Date.now() - 86400000));
  if(data.lastVisit === yesterday){
    data.streak = (data.streak||0) + 1;
  } else {
    data.streak = 1; // first visit ever, or the streak was broken
  }
  data.longestStreak = Math.max(data.longestStreak||0, data.streak);
  data.totalDaysUsed = (data.totalDaysUsed||0) + 1;
  data.lastVisit = today;
  saveStreakData(data);
  return data;
}

function fmt(n, d=2){ if(n===null||n===undefined||isNaN(n)) return "—"; return Number(n).toFixed(d); }
function fmtMoney(n){ if(n===null||n===undefined||isNaN(n)) return "—"; const s = n<0 ? "-$" : "$"; return s + Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

function seedFromTicker(t){
  let h = 0;
  for(let i=0;i<t.length;i++){ h = (h*31 + t.charCodeAt(i)) >>> 0; }
  return h;
}
function rand(seed, min, max){
  const x = Math.sin(seed) * 10000;
  const f = x - Math.floor(x);
  return min + f*(max-min);
}

/* ============================= SHARED DEMO PRICE ENGINE ============================= */
/* One process, used everywhere: the Analyzer's chart/support/resistance AND the paper
   trading simulator's live positions both walk forward using this same per-step drift.
   Previously these were two unrelated random generators, so an "analysis" of a ticker
   had no real relationship to how that ticker's paper position later moved. */

function tickDrift(seed){
  return rand(seed, -0.018, 0.02); // one shared per-step volatility character
}

function generatePriceSeries(ticker, days){
  const baseSeed = seedFromTicker(ticker);
  let price = 40 + rand(baseSeed, 0, 260);
  const series = [price];
  for(let d=1; d<days; d++){
    price = price * (1 + tickDrift(seedFromTicker(ticker + "-hist" + d)));
    series.push(price);
  }
  return series; // oldest first, most recent (= "current price") last
}

/* Volume correlates with the size of that day's price move (a real, common pattern —
   bigger moves tend to draw more participation) plus a per-ticker baseline and daily
   noise, so "volume confirms the move" claims in the text can actually be checked
   against the bars, instead of being an independent coin flip. */
function generateVolumeSeries(ticker, priceSeries){
  const baseVolume = 1000000 + rand(seedFromTicker(ticker + "-volbase"), 0, 9000000);
  return priceSeries.map((price, d) => {
    const priceChangePct = d===0 ? 0 : Math.abs((price - priceSeries[d-1]) / priceSeries[d-1]);
    const dailyNoise = rand(seedFromTicker(ticker + "-vold" + d), 0.55, 1.45);
    const moveBoost = 1 + priceChangePct * 9;
    return baseVolume * dailyNoise * moveBoost;
  });
}

function renderPriceChartSVG(series, support, resistance, trendUp){
  const w = 300, h = 110, pad = 10;
  const min = Math.min(...series, support, resistance);
  const max = Math.max(...series, support, resistance);
  const range = (max - min) || 1;
  const stepX = (w - pad*2) / (series.length - 1);
  const toY = (v) => h - pad - ((v - min) / range) * (h - pad*2);
  const points = series.map((v,i) => `${(pad + i*stepX).toFixed(1)},${toY(v).toFixed(1)}`).join(" ");
  const supportY = toY(support).toFixed(1);
  const resistanceY = toY(resistance).toFixed(1);
  const lastX = (pad + (series.length-1)*stepX).toFixed(1);
  const lastY = toY(series[series.length-1]).toFixed(1);
  const lineColor = trendUp ? "#39d9a4" : "#e56c7d";
  return `
    <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" xmlns="http://www.w3.org/2000/svg" style="display:block;">
      <line x1="${pad}" y1="${supportY}" x2="${w-pad}" y2="${supportY}" stroke="#7fd8ff" stroke-width="1" stroke-dasharray="3,3" />
      <line x1="${pad}" y1="${resistanceY}" x2="${w-pad}" y2="${resistanceY}" stroke="#f0b545" stroke-width="1" stroke-dasharray="3,3" />
      <polyline points="${points}" fill="none" stroke="${lineColor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${lastX}" cy="${lastY}" r="3.5" fill="${lineColor}" />
    </svg>
  `;
}

function renderVolumeChartSVG(priceSeries, volumeSeries){
  const w = 300, h = 46, pad = 10;
  const maxVol = Math.max(...volumeSeries) || 1;
  const stepX = (w - pad*2) / volumeSeries.length;
  const barW = Math.max(1, stepX * 0.65);
  const bars = volumeSeries.map((v,i) => {
    const barH = (v / maxVol) * (h - 4);
    const x = pad + i*stepX;
    const y = h - barH;
    const up = i===0 ? true : priceSeries[i] >= priceSeries[i-1];
    const color = up ? "#1f5e4e" : "#6b2430";
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="${color}" />`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" xmlns="http://www.w3.org/2000/svg" style="display:block; margin-top:6px;">${bars}</svg>`;
}

function renderCandleSVG(candles, opts={}){
  const w = opts.width || 200, h = opts.height || 150, pad = 20;
  const vals = candles.flatMap(c=>[c.open,c.high,c.low,c.close]);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max-min) || 1;
  const toY = v => h - pad - ((v-min)/range)*(h-pad*2);
  const stepX = (w - pad*2) / candles.length;
  const candleW = Math.min(36, stepX * 0.5);
  const parts = candles.map((c,i)=>{

    const bodyTop = toY(Math.max(c.open,c.close));

function generateConfidence({ trendUp, volumeUp, fundamentals, dataQuality, profile }){
  let score = 50;
  const factors = [];
  const fw = fundamentalWeight(profile.timeframePref);

  if(trendUp){ score += 10; factors.push({dir:"up", text:"Recent swing structure supports the trend read (higher lows)."}); }
  else { score -= 5; factors.push({dir:"down", text:"Trend structure looks choppy or turning — less clean evidence to lean on."}); }

  if(volumeUp){ score += 8; factors.push({dir:"up", text:"Volume is confirming the recent price move."}); }
  else { score -= 6; factors.push({dir:"down", text:"Volume isn't confirming the move — participation looks thin."}); }

  if(fundamentals.composite>=70){ score += fw; factors.push({dir:"up", text:`Fundamental score is strong (${fundamentals.composite}/100), adding support.`}); }
  else if(fundamentals.composite<45){ score -= fw; factors.push({dir:"down", text:`Fundamental score is weak (${fundamentals.composite}/100) — limited support here.`}); }
  else { factors.push({dir:"neutral", text:`Fundamental score is moderate (${fundamentals.composite}/100) — a secondary factor.`}); }

  if(dataQuality.overall==="Good"){ score += 6; factors.push({dir:"up", text:"Underlying data is complete and reasonably fresh."}); }
  else { score -= 10; factors.push({dir:"down", text:`Data quality is ${dataQuality.overall.toLowerCase()} (${dataQuality.completeness.toLowerCase()}) — treat this read with extra caution.`}); }

  score = Math.max(5, Math.min(95, Math.round(score)));
  const label = score>=70 ? "High" : score>=45 ? "Medium" : "Low";
  return { score, label, factors };
}

/* ============================= PAPER TRADING SIMULATION ============================= */
/* Open positions move using a deterministic seeded random walk keyed to the ticker
   and a tick count — no backend needed, but it behaves like a real position that
   can hit its stop or target on its own, instead of a form the user fills in twice. */

function ticksElapsed(t){
  const minutesElapsed = t.openedAt ? (Date.now() - new Date(t.openedAt).getTime()) / 60000 : 0;
  const timeTicks = Math.max(0, Math.floor(minutesElapsed / 2)); // ~1 tick per 2 real minutes
  return Math.min(300, (t.manualTicks||0) + timeTicks); // capped so very old demo positions don't loop forever
}

function simulatedPrice(ticker, entry, ticks){
  let price = parseFloat(entry);
  if(isNaN(price) || ticks<=0) return price;
  for(let i=1; i<=ticks; i++){
    price = price * (1 + tickDrift(seedFromTicker(ticker + "-tick" + i)));
  }
  return price;
}

function closeTrade(t, exitPrice, reason){
  const entry = parseFloat(t.entry);
  const pct = t.direction==="short" ? ((entry-exitPrice)/entry*100) : ((exitPrice-entry)/entry*100);
  t.status = "closed";
  t.exit = fmt(exitPrice,2);
  t.resultPct = fmt(pct,1);
  t.closeReason = reason;
  if(t.qty>0){
    // Return cash: selling a long position brings cash in; covering a short
    // position spends cash. Because the cost/proceeds at entry were already
    // moved when the position opened, this single line correctly reflects
    // the realized profit or loss in the balance.
    state.portfolio.cash += (t.direction==="short" ? -1 : 1) * t.qty * exitPrice;
  }
  captureDecision({ ticker: t.ticker, action: `Trade closed (${reason})`, confidence:null, confidenceLabel:null, fundamental:null, dataQuality:null });
}

/* Runs once per render pass: advances open positions and auto-closes any that
   have crossed their stop or target in the simulation. */
function processOpenPositions(){
  state.trades.forEach(t=>{
    if(t.status!=="open") return;
    const stop = parseFloat(t.stop), target = parseFloat(t.target);
    if(isNaN(stop) || isNaN(target)) return;
    const ticks = ticksElapsed(t);
    const price = simulatedPrice(t.ticker, t.entry, ticks);
    const hitTarget = t.direction==="short" ? price<=target : price>=target;
    const hitStop = t.direction==="short" ? price>=stop : price<=stop;
    if(hitTarget) closeTrade(t, target, "target hit");
    else if(hitStop) closeTrade(t, stop, "stop hit");
  });
}

function computePortfolioValue(){
  let value = state.portfolio.cash;
  state.trades.filter(t=>t.status==="open" && t.qty>0).forEach(t=>{
    const price = simulatedPrice(t.ticker, t.entry, ticksElapsed(t));
    value += (t.direction==="short" ? -1 : 1) * t.qty * price;
  });
  return value;
}

function computeUserProcessScore(){
  const closed = state.trades.filter(t=>t.status==="closed");
  const adherence = closed.length ? Math.round(closed.filter(t=>t.followedPlan==="yes").length/closed.length*100) : null;
  const learn = levelPercent();
  const masteredCount = Object.values(state.topicMastery).filter(m=>m.mastered).length;
  if(adherence===null && learn===0 && masteredCount===0) return null; // not enough activity yet to rank
  const base = adherence===null ? learn : Math.round((learn+adherence)/2);
  return Math.min(100, base + masteredCount*3);
}

function levelPercent(){
  const mappedSlots = [];
  Object.values(TOPIC_LEVEL_MAP).forEach(slots => slots.forEach(s => mappedSlots.push(s.level+"-"+s.index)));
  const total = mappedSlots.length;
  const done = mappedSlots.filter(key => state.levelsComplete[key]).length;
  return total ? Math.round((done/total)*100) : 0;
}
function currentLevelObj(){
  for(const lvl of LEVELS){
    const mappedIndexes = [];
    Object.values(TOPIC_LEVEL_MAP).forEach(slots => slots.forEach(s => { if(s.level===lvl.id) mappedIndexes.push(s.index); }));
    if(mappedIndexes.length===0) continue; // nothing built for this level yet — don't get stuck waiting on it
    const doneInLevel = mappedIndexes.filter(i => state.levelsComplete[lvl.id+"-"+i]).length;
    if(doneInLevel < mappedIndexes.length) return lvl;
  }
  return LEVELS[LEVELS.length-1];
}

  if(nav.jtab) state.journalTab = nav.jtab;
  if(nav.ltab) state.learnTab = nav.ltab;
  if(nav.ctab) state.communityTab = nav.ctab;
  go(nav.screen);
}

/* ============================= RENDER ROOT ============================= */

function render(){
  processOpenPositions();
  persistState();
  const root = document.getElementById("root");
  const showTabs = state.screen !== "onboarding";
  root.innerHTML = `
    <div class="status-strip">
      <span><span class="dot"></span>Demo mode — teaching &amp; paper trading only, no real trades</span>
      ${showTabs ? `<button id="resetBtn">Reset demo</button>` : ""}
    </div>
    <div class="screen ${showTabs ? "" : "no-tab"}" id="screenBody"></div>
    ${showTabs ? renderTabbar() : ""}
    ${renderModal()}
  `;
  const body = document.getElementById("screenBody");
  switch(state.screen){
    case "onboarding": body.innerHTML = renderOnboarding(); break;
    case "home": body.innerHTML = renderHome(); break;
    case "learn": body.innerHTML = renderLearn(); break;
    case "analyze": body.innerHTML = renderAnalyze(); break;
    case "community": body.innerHTML = renderCommunity(); break;
    case "journal": body.innerHTML = renderJournal(); break;
    case "profile": body.innerHTML = renderProfile(); break;
    case "editProfile": body.innerHTML = renderEditProfile(); break;
    case "review": body.innerHTML = renderReview(); break;
  }
  bindEvents();
  const resetBtn = document.getElementById("resetBtn");
  if(resetBtn) resetBtn.addEventListener("click", ()=>{
    showConfirm("This clears your profile, journal, progress, and paper trading balance. This can't be undone.", ()=>{
      resetDemo();
    }, "Reset all demo data?");
  });
  on2("modalOk","click", closeModal);
  on2("modalCancel","click", closeModal);
  on2("modalConfirm","click", ()=>{
    const cb = state.modal && state.modal.onConfirm;
    state.modal = null;
    if(cb) cb();
    render();
  });
  qa("[data-glossary]").forEach(el=>el.addEventListener("click", (e)=>{
    e.preventDefault();
    const g = GLOSSARY[el.getAttribute("data-glossary")];
    if(g) showAlert(g.def, g.term);
  }));
}
function on2(elId, evt, fn){ const e = document.getElementById(elId); if(e) e.addEventListener(evt, fn); }

function renderTabbar(){
  const items = [
    {id:"home", icon:"⌂", label:"Home"},
    {id:"learn", icon:"◐", label:"Learn"},
    {id:"analyze", icon:"◱", label:"Analyze"},
    {id:"community", icon:"◈", label:"Community"},
    {id:"journal", icon:"✎", label:"Journal"},
    {id:"profile", icon:"◍", label:"Profile"},
  ];
  return `<div class="tabbar">
    ${items.map(it => `
      <button data-nav="${it.id}" class="${state.screen===it.id || (state.screen==="review" && it.id==="journal") ? "active":""}">
        <span class="icon">${it.icon}</span>${it.label}
      </button>`).join("")}
  </div>`;
}

function resetDemo(){
  state.screen = "onboarding";
  state.obStep = 0;
  state.profile = { displayName:"", avatarEmoji:"🦁", experience:null, goals:[], riskTolerance:null, timeframePref:null, instruments:[] };
  state.levelsComplete = {};
  state.topicMastery = {};
  state.quizStats = {};
  state.currentQuizSession = null;
  state.trades = [];
  state.portfolio = { startingBalance:10000, cash:10000 };
  state.hasAnalyzed = false;
  state.hasBuiltPlan = false;
  state.hasOpenedTrade = false;
  state.hasVisitedCommunity = false;
  state.feedback = { stars:0, note:"", pay:null, payFor:null, submitted:false };
  render();
}

function activeAlertCount(){ return state.alerts.filter(a=>a.status==="active").length; }
function userDisplayName(){ return (state.profile.displayName && state.profile.displayName.trim()) || "You"; }
function userAvatar(){ return state.profile.avatarEmoji || "🦁"; }
function isNameTaken(name){
  const trimmed = (name||"").trim().toLowerCase();
  if(!trimmed) return false; // a blank name isn't "taken" — it just falls back to "You"
  return state.communityMembers.some(m => m.name.trim().toLowerCase() === trimmed);
}
function goalLabels(){
  const labels = GOAL_OPTIONS.filter(o=>state.profile.goals.includes(o.id)).map(o=>o.label);
  return labels.length ? labels.join(", ") : "—";
}
function quickAction(icon,label,screenId,subtab){
  return `<button class="card" style="text-align:left; cursor:pointer; margin-bottom:0;" data-nav="${screenId}" ${subtab?`data-atab="${subtab}"`:""}>
    <div style="font-size:20px; margin-bottom:6px;">${icon}</div>
    <div style="font-size:13.5px; font-weight:600;">${label}</div>
  </button>`;
}
function todaysInsight(){
  const insights = [
    "Before looking for your next trade, let's make sure you know exactly how much you're willing to risk.",
    "A plan without an invalidation point isn't a plan — it's a hope.",
    "Process beats outcome. A losing trade taken well is still a good trade.",
  ];
  return insights[Object.keys(state.levelsComplete).length % insights.length];
}

function renderTeacher(){
  if(state.teacherView === "menu"){
    const selected = state.profile.instruments.filter(i=>i!=="stocks"); // stocks content lives in "universal"
    const specialtyTopics = Object.entries(TOPICS).filter(([,t])=>selected.includes(t.instrument));
    const universalTopics = Object.entries(TOPICS).filter(([,t])=>t.instrument==="universal");
    const topicButton = ([key,t]) => `
          <button class="choice" data-topic="${key}">
            <span class="label">${t.title} ${isMastered(key) ? '<span class="badge level-done">✓ Mastered</span>' : ''}</span>
            <span class="desc">${t.level}</span>
          </button>`;
    return `
      <p class="subtitle">Pick a topic, or ask your own question below.</p>
      ${specialtyTopics.length ? `
        <div class="section-label">For your instruments</div>
        <div class="choice-list">${specialtyTopics.map(topicButton).join("")}</div>
      ` : ""}
      ${specialtyTopics.length ? `<div class="section-label">Core fundamentals (apply to any instrument)</div>` : ""}
      <div class="choice-list">
        ${universalTopics.map(topicButton).join("")}
      </div>
      <div class="card" style="margin-top:6px;">
        <div class="card-title">Or ask anything</div>
        <textarea id="askInput" placeholder="e.g. What is a stop-loss?">${state.askInput}</textarea>
        <button class="btn btn-primary" id="askBtn" style="margin-top:10px;">Ask the coach</button>
      </div>
      ${state.freeAskLoading ? `<div class="bubble coach" style="margin-top:10px;"><div class="coach-name">Coach</div>Thinking…</div>` : ""}
      ${(!state.freeAskLoading && state.freeAskAnswer) ? `<div class="bubble coach" style="margin-top:10px;"><div class="coach-name">Coach</div>${state.freeAskAnswer}</div>` : ""}
    `;
  }

  const topic = TOPICS[state.teacherTopic];
  const isNew = state.profile.experience === "new" || state.profile.experience === "learning";

  if(state.teacherView === "quiz_result"){
    const liveArr = state.liveContent["quiz:"+state.teacherTopic];
    const nextKey = nextUnmasteredTopic(state.teacherTopic);
    const nextTitle = nextKey ? TOPICS[nextKey].title : null;

    if(liveArr){
      // Live mode has no fixed bank to track progress against — an infinitely
      // generated question uses the simpler "get this pass right" rule.
      const total = liveArr.length;
      const passed = state.quizCorrectCount === total;
      return `
        <div class="top-back">
          <button data-back="teacherMenu">←</button>
          <div class="ttl">${topic.title}</div>
        </div>
        <div class="card" style="${passed ? 'border-color:var(--accent-dim); background:#0f2921;' : ''}">
          <div class="coach-name">${passed ? "✓ Mastered" : "Not quite yet"}</div>
          <div style="font-weight:700; font-size:16px; margin-bottom:6px;">You got ${state.quizCorrectCount} of ${total} right</div>
          <p style="margin:0; font-size:13.5px; line-height:1.55; color:var(--text-muted);">
            ${passed
              ? "That's a passing score — this topic is now marked mastered, and it's checked off automatically anywhere it appears on your Learning Path."
              : "Mastery means getting every question right in one pass — that's what makes it a real signal, not a guess. Review the explanation and example, then try again whenever you're ready."}
          </p>
        </div>
        ${passed ? `
          ${nextKey ? `
            <div class="section-label">Ready to move on</div>
            <div class="card flat">
              <p class="card-sub" style="margin:0 0 12px 0;">Since you've mastered this, the natural next topic is <b style="color:var(--text);">${nextTitle}</b>.</p>
              <button class="btn btn-primary" id="goNextTopic">Learn ${nextTitle} →</button>
            </div>
          ` : `
            <div class="card flat">
            <p class="card-sub" style="margin:0 0 10px 0;">You've now mastered every topic currently built for your profile — genuinely well done, that's real, quiz-verified understanding, not a checklist.</p>
            <p class="card-sub" style="margin:0;">This curriculum is still growing. The next real step up is putting this to work: open more paper trades, compare notes in Community, and set an alert on something you're watching. If live AI coaching gets turned on, every topic here can go deeper on demand instead of staying fixed.</p>
          </div>
          `}
        ` : `
          <div class="btn-row" style="margin-top:4px;">
            <button class="btn btn-ghost" id="reviewExplainAgain">Review explanation</button>
            <button class="btn btn-primary" id="retryQuiz">Try again</button>
          </div>
        `}
      `;
    }

    // Static mode: real bank-wide adaptive progress, not a single-session pass/fail.
    const bank = topic.quiz;
    const solidCount = countCorrectInBank(state.teacherTopic);
    const fullyMastered = solidCount === bank.length;
    const sessionTotal = (state.currentQuizSession || bank).length;
    return `
      <div class="top-back">
        <button data-back="teacherMenu">←</button>
        <div class="ttl">${topic.title}</div>
      </div>
      <div class="card" style="${fullyMastered ? 'border-color:var(--accent-dim); background:#0f2921;' : ''}">
        <div class="coach-name">${fullyMastered ? "✓ Mastered" : "Making progress"}</div>
        <div style="font-weight:700; font-size:16px; margin-bottom:6px;">You got ${state.quizCorrectCount} of ${sessionTotal} right this round</div>
        <div class="progress-track" style="margin:10px 0 6px 0;"><div class="progress-fill" style="width:${Math.round(solidCount/bank.length*100)}%"></div></div>
        <div style="font-size:11.5px; color:var(--text-muted); margin-bottom:8px;">${solidCount} of ${bank.length} questions in this topic are solid</div>
        <p style="margin:0; font-size:13.5px; line-height:1.55; color:var(--text-muted);">
          ${fullyMastered
            ? `You've now answered all ${bank.length} questions in this topic correctly — it's marked mastered, and checked off automatically anywhere it appears on your Learning Path.`
            : `The ones you haven't nailed yet will come back around next round, prioritized ahead of what you already know — that's the point, not a one-shot pass/fail.`}
        </p>
      </div>
      ${fullyMastered ? `
        ${nextKey ? `
          <div class="section-label">Ready to move on</div>
          <div class="card flat">
            <p class="card-sub" style="margin:0 0 12px 0;">Since you've mastered this, the natural next topic is <b style="color:var(--text);">${nextTitle}</b>.</p>
            <button class="btn btn-primary" id="goNextTopic">Learn ${nextTitle} →</button>
          </div>
        ` : `
          <div class="card flat">
            <p class="card-sub" style="margin:0 0 10px 0;">You've now mastered every topic currently built for your profile — genuinely well done, that's real, quiz-verified understanding, not a checklist.</p>
            <p class="card-sub" style="margin:0;">This curriculum is still growing. The next real step up is putting this to work: open more paper trades, compare notes in Community, and set an alert on something you're watching. If live AI coaching gets turned on, every topic here can go deeper on demand instead of staying fixed.</p>
          </div>
        `}
      ` : `
        <div class="btn-row" style="margin-top:4px;">
          <button class="btn btn-ghost" id="reviewExplainAgain">Review explanation</button>
          <button class="btn btn-primary" id="retryQuiz">Keep practicing →</button>
        </div>
      `}
    `;
  }

  let inner = "";
  if(state.teacherView === "explain"){
    const explainKey = "explain:"+state.teacherTopic;
    const followupKey = "followup:"+state.teacherTopic;
    const liveExplain = state.liveContent[explainKey];
    const liveFollowup = state.liveContent[followupKey];
    const explainLoading = state.liveLoading[explainKey] && liveExplain===undefined;
    inner = explainLoading ? `
      <div class="bubble coach"><div class="coach-name">Coach</div>Thinking through how to explain this…</div>
    ` : `
      <div class="bubble coach">
        <div class="coach-name">Coach</div>
        ${liveExplain || (isNew ? topic.explain.new : (topic.explain.inter || topic.explain.new))}
      </div>
      ${topic.showAnatomyDiagram ? `
      <div class="card" style="margin-bottom:10px;">
        ${renderCandleAnatomySVG()}
        <p class="card-sub" style="margin:8px 0 0 0; text-align:center;">A single candle, labeled — this is what every candle on a chart shows you.</p>
      </div>
      ` : ""}
      ${liveExplain ? "" : `
      <div class="bubble coach">
        <div class="coach-name">Coach asks</div>
        ${topic.socratic}
      </div>
      `}
      <div class="chip-row">
        <button class="chip" data-reveal="1">I have a guess — show me the answer</button>
      </div>
      ${state.reveal ? `<div class="bubble coach" style="margin-top:6px;">${liveFollowup || topic.socraticFollowup}</div>` : ""}
    `;
  } else if(state.teacherView === "example"){
    inner = `
      ${topic.exampleCandle ? `
        <div class="card" style="margin-bottom:10px;">
          ${renderCandleSVG([topic.exampleCandle], {width:160})}
        </div>
      ` : ""}
      <div class="bubble coach">
        <div class="coach-name">Example</div>
        ${topic.example}
      </div>
      <div class="warn-box">This example uses illustrative numbers for teaching purposes — it is not a live quote or a trade signal.</div>
    `;
  } else if(state.teacherView === "quiz"){
    const quizKey = "quiz:"+state.teacherTopic;
    const quizLoading = state.liveLoading[quizKey] && state.liveContent[quizKey]===undefined;
    if(quizLoading){
      inner = `<div class="bubble coach"><div class="coach-name">Coach</div>Writing you a question…</div>`;
    } else {
    const quizArr = state.liveContent[quizKey] || state.currentQuizSession || topic.quiz;
    const q = quizArr[state.quizIndex] || quizArr[0];
    const isLiveQuiz = !!state.liveContent[quizKey];
    const bankProgress = isLiveQuiz ? "" : ` · ${countCorrectInBank(state.teacherTopic)}/${topic.quiz.length} solid overall`;
    inner = `
      ${q.candle ? `<div class="card" style="margin-bottom:10px;">${renderCandleSVG([q.candle], {width:140})}</div>` : ""}
      <div class="bubble coach">
        <div class="coach-name">Quiz — question ${state.quizIndex+1} of ${quizArr.length}${bankProgress}</div>
        ${q.q}
      </div>
      <div class="choice-list">
        ${q.options.map((opt,i)=>`
          <button class="choice ${state.quizAnswered===i ? (i===q.correct?'selected':''):''}" data-quizopt="${i}" ${state.quizAnswered!==null?"disabled":""} style="${state.quizAnswered!==null && i===q.correct ? 'border-color:var(--accent); box-shadow: inset 0 0 0 1px var(--accent);':''} ${state.quizAnswered!==null && i===state.quizAnswered && i!==q.correct ? 'border-color:var(--danger); box-shadow: inset 0 0 0 1px var(--danger);':''}">
            <span class="label">${opt}</span>
          </button>`).join("")}
      </div>
      ${state.quizAnswered!==null ? `
        <div class="${state.quizAnswered===q.correct?'ok-box':'warn-box'}">${q.feedback}</div>
        ${state.quizIndex < quizArr.length-1 ? `<button class="btn btn-primary" id="nextQuiz" style="margin-top:12px;">Next question</button>` : `<button class="btn btn-primary" id="finishQuiz" style="margin-top:12px;">Finish quiz</button>`}
      ` : ""}
    `;
    }
  } else if(state.teacherView === "challenge"){
    const challengeKey = "challenge:"+state.teacherTopic;
    const liveChallenge = state.liveContent[challengeKey];
    const challengeLoading = state.liveLoading[challengeKey] && liveChallenge===undefined;
    inner = challengeLoading ? `
      <div class="bubble coach"><div class="coach-name">Challenge</div>Coming up with something for you…</div>
    ` : `
      <div class="bubble coach">
        <div class="coach-name">Challenge</div>
        ${liveChallenge || topic.challenge}
      </div>
      <p class="subtitle">Do this on your own chart or journal — there's nothing to submit here in the POC.</p>
      <button class="btn btn-primary" id="markLearned">Mark this topic as practiced</button>
    `;
  }

  return `
    <div class="top-back">
      <button data-back="teacherMenu">←</button>
      <div class="ttl">${topic.title}</div>
    </div>
    <div class="subtabs">
      <button data-tview="explain" class="${state.teacherView==='explain'?'active':''}">Explain like I'm new</button>
      <button data-tview="example" class="${state.teacherView==='example'?'active':''}">Show example</button>
    </div>
    <div class="subtabs">
      <button data-tview="quiz" class="${state.teacherView==='quiz'?'active':''}">Quiz me</button>
      <button data-tview="challenge" class="${state.teacherView==='challenge'?'active':''}">Give me a challenge</button>
    </div>
    ${inner}
  `;
}

function renderLearningPath(){
  return `
    <p class="subtitle">Work through each level. This POC tracks progress in this session only.</p>
    ${LEVELS.map(lvl => {
      const mappedIndexes = [];
      Object.values(TOPIC_LEVEL_MAP).forEach(slots => slots.forEach(s => { if(s.level===lvl.id) mappedIndexes.push(s.index); }));
      const hasContent = mappedIndexes.length > 0;
      const doneCount = mappedIndexes.filter(i=>state.levelsComplete[lvl.id+"-"+i]).length;
      const isDone = hasContent && doneCount === mappedIndexes.length;
      const isCurrent = currentLevelObj().id === lvl.id;
      return `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <div class="card-title" style="margin:0;">Level ${lvl.id} — ${lvl.name}</div>
            <span class="badge ${isDone?'level-done':(isCurrent?'level-current':'')}">${!hasContent ? 'Coming soon' : (isDone?'Complete':doneCount+"/"+mappedIndexes.length)}</span>
          </div>
          ${lvl.topics.map((t,i) => {
            const linkedTopic = findTopicForLevelSlot(lvl.id, i);
            const done = state.levelsComplete[lvl.id+"-"+i];
            if(linkedTopic){
              return `
                <div class="checklist-item">
                  <span class="mark ${done?'yes':'neutral'}">${done?'✓':'○'}</span>
                  <div style="flex:1;">
                    <span style="font-size:13.5px; ${done ? 'color:var(--text-muted); text-decoration:line-through;':''}">${t}</span>
                    <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">${done ? "Verified by quiz" : "Requires passing the quiz"}${!done ? ` · <a data-gotoquiz="${linkedTopic}" style="color:var(--accent); cursor:pointer; text-decoration:underline;">Take it now</a>` : ""}</div>
                  </div>
                </div>
              `;
            }
            return `
            <div class="checklist-item">
              <span class="mark neutral">○</span>
              <div style="flex:1;">
                <span style="font-size:13.5px; color:var(--text-muted);">${t}</span>
                <div style="font-size:11px; color:var(--warm); margin-top:2px;">Coming soon — no lesson built for this yet</div>
              </div>
            </div>
          `;
          }).join("")}
        </div>
      `;
    }).join("")}
  `;
}

function generateAnalysis(tickerRaw, profile){
  const ticker = tickerRaw.trim().toUpperCase().slice(0,6) || "DEMO";
  const seed = seedFromTicker(ticker);
  const series = generatePriceSeries(ticker, 30);
  const volumeSeries = generateVolumeSeries(ticker, series);
  const currentPrice = series[series.length-1];
  const window = series.slice(-15);
  const support = Math.min(...window);
  const resistance = Math.max(...window);
  const earlyAvg = series.slice(0,10).reduce((a,v)=>a+v,0)/10;
  const lateAvg = series.slice(-10).reduce((a,v)=>a+v,0)/10;
  const trendUp = lateAvg > earlyAvg;
  const recentVolAvg = volumeSeries.slice(-5).reduce((a,v)=>a+v,0)/5;
  const priorVolAvg = volumeSeries.slice(-15,-5).reduce((a,v)=>a+v,0)/10;
  const volumeUp = recentVolAvg > priorVolAvg;

  const fundamentals = generateFundamentals(seed);
  const dataQuality = generateDataQuality(seed);
  const confidence = generateConfidence({ trendUp, volumeUp, fundamentals, dataQuality, profile });
  const wantsOptions = profile.instruments.includes("options");
  const wantsFutures = profile.instruments.includes("futures");
  const wantsCrypto = profile.instruments.includes("crypto");
  const optionsContext = wantsOptions ? generateOptionsContext(seed) : null;
  const futuresContext = wantsFutures ? generateFuturesContext(seed) : null;
  const cryptoContext = wantsCrypto ? generateCryptoContext(seed) : null;

  return {
    ticker,
    series,
    volumeSeries,
    currentPrice,
    trendUp,
    fundamentals,
    dataQuality,
    confidence,
    optionsContext,
    futuresContext,
    cryptoContext,
    context: {

/* Shared validation: rejects non-positive prices/account/contracts/risk% before
   any math runs. A negative account size, for example, previously produced a
   negative position size that could pass the insufficient-funds check and add
   money to the balance instead of spending it — found during testing, fixed here. */
function validatePositiveInputs(fields){
  for(const [label, value] of fields){
    if(value<=0) return `${label} must be a positive number.`;
  }
  return null;
}

function computeStockPlan(p){
  const entry = parseFloat(p.entry), stop = parseFloat(p.stop), target = parseFloat(p.target);
  const account = parseFloat(p.account), riskPct = parseFloat(p.riskPct);
  if([entry,stop,target,account,riskPct].some(v=>isNaN(v)) || entry===stop){
    return { error: "Fill in entry, stop, target, account size, and risk % with valid numbers (entry and stop can't be equal)." };
  }
  const posErr = validatePositiveInputs([["Entry",entry],["Stop",stop],["Target",target],["Account size",account],["Risk %",riskPct]]);
  if(posErr) return { error: posErr };
  if(riskPct>100) return { error: "Max risk % can't be more than 100." };
  const riskPerShare = Math.abs(entry-stop);
  const dollarRisk = account * (riskPct/100);
  const positionSize = Math.floor(dollarRisk / riskPerShare);
  const rewardPerShare = Math.abs(target-entry);
  const rr = rewardPerShare / riskPerShare;
  const totalReward = rewardPerShare * positionSize;
  const totalRiskActual = riskPerShare * positionSize;
  const directionOk = p.direction === "long" ? (target>entry && stop<entry) : (target<entry && stop>entry);
  const positionCost = positionSize * entry;
  const affordable = positionCost <= account;
  return { riskPerShare, dollarRisk, positionSize, rewardPerShare, rr, totalReward, totalRiskActual, directionOk, positionCost, affordable };
}

function computeOptionsPlan(p){
  const strike = parseFloat(p.strike), premium = parseFloat(p.premium);
  const contractsRaw = parseFloat(p.contracts);
  const targetPrice = parseFloat(p.targetPrice), account = parseFloat(p.account), riskPct = parseFloat(p.riskPct);
  if([strike,premium,contractsRaw,targetPrice,account,riskPct].some(v=>isNaN(v))){
    return { error: "Fill in strike, premium, contracts, target price, account size, and risk % with valid numbers." };
  }
  if(!Number.isInteger(contractsRaw) || contractsRaw<1){
    return { error: "Contracts must be a whole number, 1 or more — fractional option contracts aren't available." };
  }
  const posErr = validatePositiveInputs([["Strike",strike],["Premium",premium],["Target price",targetPrice],["Account size",account],["Risk %",riskPct]]);
  if(posErr) return { error: posErr };
  if(riskPct>100) return { error: "Max risk % can't be more than 100." };
  const contracts = contractsRaw;
  const totalCost = premium * 100 * contracts;
  const breakeven = p.optionType==='call' ? strike+premium : strike-premium;
  const intrinsicAtTarget = p.optionType==='call' ? Math.max(0, targetPrice-strike) : Math.max(0, strike-targetPrice);
  const estValueAtTarget = intrinsicAtTarget * 100 * contracts;
  const estPL = estValueAtTarget - totalCost;
  const riskBudget = account * (riskPct/100);
  const overBudget = totalCost > riskBudget;
  return { totalCost, breakeven, estValueAtTarget, estPL, riskBudget, overBudget };
}

function computeFuturesPlan(p){
  const entry = parseFloat(p.entry), stop = parseFloat(p.stop), target = parseFloat(p.target);
  const pointValue = parseFloat(p.pointValue), contractsRaw = parseFloat(p.contracts);
  const account = parseFloat(p.account), riskPct = parseFloat(p.riskPct);
  if([entry,stop,target,pointValue,contractsRaw,account,riskPct].some(v=>isNaN(v)) || entry===stop){
    return { error: "Fill in entry, stop, target, point value, contracts, account size, and risk % with valid numbers (entry and stop can't be equal)." };
  }
  if(!Number.isInteger(contractsRaw) || contractsRaw<1){
    return { error: "Contracts must be a whole number, 1 or more — fractional futures contracts aren't available." };
  }
  const posErr = validatePositiveInputs([["Entry",entry],["Stop",stop],["Target",target],["Point value",pointValue],["Account size",account],["Risk %",riskPct]]);
  if(posErr) return { error: posErr };
  if(riskPct>100) return { error: "Max risk % can't be more than 100." };
  const contracts = contractsRaw;
  const pointsAtRisk = Math.abs(entry-stop);
  const dollarRiskPerContract = pointsAtRisk * pointValue;
  const totalRisk = dollarRiskPerContract * contracts;
  const rewardPoints = Math.abs(target-entry);
  const totalReward = rewardPoints * pointValue * contracts;
  const rr = rewardPoints / pointsAtRisk;
  const riskBudget = account * (riskPct/100);
  const overBudget = totalRisk > riskBudget;
  const directionOk = p.direction === "long" ? (target>entry && stop<entry) : (target<entry && stop>entry);
  return { pointsAtRisk, dollarRiskPerContract, totalRisk, rewardPoints, totalReward, rr, riskBudget, overBudget, directionOk };
}

function computeCryptoPlan(p){
  const entry = parseFloat(p.entry), stop = parseFloat(p.stop), target = parseFloat(p.target);
  const account = parseFloat(p.account), riskPct = parseFloat(p.riskPct);
  if([entry,stop,target,account,riskPct].some(v=>isNaN(v)) || entry===stop || target<=entry || stop>=entry){
    return { error: "Fill in entry, stop, target, account size, and risk % with valid numbers — for this spot (long-only) plan, stop should be below entry and target above it." };
  }
  const posErr = validatePositiveInputs([["Entry",entry],["Stop",stop],["Target",target],["Account size",account],["Risk %",riskPct]]);
  if(posErr) return { error: posErr };
  if(riskPct>100) return { error: "Max risk % can't be more than 100." };
  const riskPerUnit = Math.abs(entry-stop);
  const dollarRisk = account * (riskPct/100);
  const positionSize = dollarRisk / riskPerUnit; // fractional units allowed
  const rewardPerUnit = Math.abs(target-entry);
  const rr = rewardPerUnit / riskPerUnit;
  const totalReward = rewardPerUnit * positionSize;
  const totalRiskActual = riskPerUnit * positionSize;
  const positionCost = positionSize * entry;
  const affordable = positionCost <= account;
  return { riskPerUnit, dollarRisk, positionSize, rewardPerUnit, rr, totalReward, totalRiskActual, positionCost, affordable };
}

function computePlan(p){
  return (PLAN_COMPUTE[p.instrument] || computeStockPlan)(p);
}

      <p class="card-sub" style="margin-bottom:0;">${p.thesis ? `You stated: "${escapeHtml(p.thesis).slice(0,180)}${p.thesis.length>180?'…':''}" — ask yourself what specific price action, and by when, would prove that wrong.` : "You haven't written a thesis yet — add one above, including your timeline, since options have an expiration your thesis needs to account for."}</p>
    </div>

    <div class="btn-row">
      <button class="btn btn-ghost" id="editPlan">Adjust</button>
      <button class="btn btn-primary" id="logPlanTrade">Log this plan (options tracking is manual for now)</button>
    </div>
  `;
}

function renderPlanResult(r,p){
  if(r.error){
    return `<div class="warn-box">${r.error}</div>`;
  }
  if(!r.directionOk){
    return `<div class="warn-box">For a ${p.direction} trade, your stop, entry, and target should be ordered correctly (e.g. a long needs stop below entry and target above entry). Adjust your numbers and recalculate.</div>`;
  }
  return `
    <div class="card">
      <div class="card-title">My trade plan</div>
      <div class="kv"><span class="k">Risk per share</span><span class="v">${fmtMoney(r.riskPerShare)}</span></div>
      <div class="kv"><span class="k">Dollar risk (${p.riskPct}% of account)</span><span class="v">${fmtMoney(r.dollarRisk)}</span></div>
      <div class="kv"><span class="k">Position size${infoDot("position-size")}</span><span class="v">${r.positionSize} sh</span></div>
      <div class="kv"><span class="k">Potential reward</span><span class="v">${fmtMoney(r.totalReward)}</span></div>
      <div class="kv"><span class="k">Actual $ at risk</span><span class="v">${fmtMoney(r.totalRiskActual)}</span></div>
      <div class="kv"><span class="k">Risk / reward ratio${infoDot("risk-reward")}</span><span class="v ${r.rr>=1.5?'pos':(r.rr<1?'neg':'')}">1 : ${fmt(r.rr,2)}</span></div>
    </div>
    ${r.rr < 1 ? `<div class="warn-box">Your potential reward is less than your defined risk (1 : ${fmt(r.rr,2)}). Before proceeding, would you like to explore how moving your target or stop changes this ratio?</div>` :
      (r.rr < 1.5 ? `<div class="warn-box">This risk/reward is workable but thin. Many disciplined traders look for at least 1.5–2x reward-to-risk so the strategy can be profitable even with a moderate win rate.</div>` :
      `<div class="ok-box">This setup offers ${fmt(r.rr,2)}x reward for every dollar risked — a healthier ratio that can tolerate a lower win rate.</div>`)}
    ${!r.affordable ? `<div class="warn-box">This position costs ${fmtMoney(r.positionCost)} to open — more than your ${fmtMoney(parseFloat(p.account))} account. You won't be able to open this as-is; try a wider stop or a lower risk % to bring the size down.</div>` : ""}

    <div class="card flat">
      <div class="card-title" style="margin-bottom:6px;">What could make this trade wrong?</div>
      <p class="card-sub" style="margin-bottom:0;">${p.thesis ? `You stated: "${escapeHtml(p.thesis).slice(0,180)}${p.thesis.length>180?'…':''}" — ask yourself what specific price action would prove that wrong, not just what would feel disappointing.` : "You haven't written a thesis yet — add one above so future-you can judge whether this trade played out as expected, or just got lucky."}</p>
    </div>

    <p class="card-sub" style="margin:4px 0 0 0;">This opens a live simulated position — its price will move on a seeded demo simulation and it will auto-close in your Journal when it crosses your stop or target. ${p.thesis ? "You've written a thesis, so you'll be able to judge later whether this played out as expected." : "Consider writing a thesis above first, so future-you can judge whether this was a good decision, not just a lucky one."}</p>
    <div class="btn-row">
      <button class="btn btn-ghost" id="editPlan">Adjust</button>
      <button class="btn btn-primary" id="logPlanTrade">Open paper trade &#8594;</button>
    </div>
  `;
}

function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================= COMMUNITY ============================= */
/* Everything here is fictional demo content, clearly labeled. Real community
   requires shared accounts and a real backend (see the design reference doc) —
   this exists so the concept and its guardrails can be tested with real users
   before that investment is made.
   Two deliberate design choices resist the usual failure mode of trading
   communities (pump-and-dump, unverified tips, FOMO amplification):
   1. Ranking is by PROCESS (adherence, mastery), never by P&L.
   2. Every idea is structurally forced through Fact/Interpretation/Assumption/
      Scenario — there's no field where a bare "buy this now" call fits. */

function renderCommunity(){
  return `
    <h2 class="eyebrow-free-title">Community</h2>
    <div class="card flat" style="margin-bottom:14px;">
      <p class="card-sub" style="margin:0;"><span class="demo-tag" style="margin-right:6px;">DEMO</span>The people below are fictional — this previews the concept before it needs real accounts. Ranking is always by process, never profit, and every idea follows the same Fact → Interpretation → Assumption → Scenario structure as the rest of the coach — no bare "buy this" calls.</p>
    </div>
    <div class="subtabs">
      <button data-ctab="leaderboard" class="${state.communityTab==='leaderboard'?'active':''}">Leaderboard</button>
      <button data-ctab="ideas" class="${state.communityTab==='ideas'?'active':''}">Idea board</button>
    </div>
    ${state.communityTab==='leaderboard' ? renderLeaderboard() : renderIdeaBoard()}
  `;
}

function renderLeaderboard(){
  const yourScore = computeUserProcessScore();
  const rows = state.communityMembers.map(m=>({ name:m.name, score:m.processScore, masteredCount:m.masteredCount, blurb:m.blurb, isYou:false }));
  if(yourScore!==null){
    rows.push({ name:`${userAvatar()} ${userDisplayName()}`, score:yourScore, masteredCount:Object.values(state.topicMastery).filter(m=>m.mastered).length, blurb:"Your live score, based on your actual plan adherence and mastered topics.", isYou:true });
  }
  rows.sort((a,b)=>b.score-a.score);

  return `
    <div class="card">
      ${rows.map((r,i)=>`
        <div class="kv" style="align-items:flex-start; ${r.isYou?'background:#0f2921; margin:0 -18px; padding:8px 18px; border-radius:10px;':''}">
          <div style="display:flex; gap:10px;">
            <span class="mono" style="color:var(--text-muted); width:18px;">${i+1}</span>
            <div>
              <div style="font-weight:600; font-size:13.5px;">${escapeHtml(r.name)}${r.isYou?' <span class="badge level-current">You</span>':''}</div>
              <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">${escapeHtml(r.blurb)}</div>
            </div>
          </div>
          <span class="v">${r.score}</span>
        </div>
      `).join("")}
    </div>
    ${yourScore===null ? `
      <div class="card flat"><p class="card-sub" style="margin:0;">You're not ranked yet — complete a lesson, log a trade, or close a paper position to get your first process score.</p></div>
    ` : ""}
    <div class="card flat">
      <p class="card-sub" style="margin:0;">Score is a mix of Learning Path progress, plan adherence on closed trades, and topics mastered — the things you actually control, not what the market happened to do.</p>
    </div>
  `;
}

function renderIdeaBoard(){
  return `
    ${state.newIdeaOpen ? renderNewIdeaForm() : `<button class="btn btn-primary" id="openNewIdea" style="margin-bottom:14px;">+ Share an idea</button>`}
    ${state.communityIdeas.slice().reverse().map(renderIdeaCard).join("")}

}

function renderJournal(){
  return `
    <h2 class="eyebrow-free-title">Journal</h2>
    <div class="subtabs">
      <button data-jtab="trades" class="${state.journalTab==='trades'?'active':''}">My trades</button>

    </div>
