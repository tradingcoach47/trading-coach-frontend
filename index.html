  `;
}

function renderTradesTab(){
  const openPositions = state.trades.filter(t=>t.status==="open");
  const loggedTrades = state.trades.filter(t=>t.status!=="open").slice().reverse();
  return `
    <div class="stat-grid" style="margin-bottom:14px;">
      <div class="stat-box"><div class="num">${fmtMoney(computePortfolioValue())}</div><div class="lbl">Total value</div></div>
      <div class="stat-box"><div class="num">${fmtMoney(state.portfolio.cash)}</div><div class="lbl">Cash available</div></div>
    </div>
    ${openPositions.length ? `
      <div class="section-label">Open positions — live demo simulation</div>
      <div class="card flat" style="margin-bottom:10px;">
        <p class="card-sub" style="margin:0;">These prices move on a seeded demo simulation tied to your ticker — not real data — and will auto-close when they cross your stop or target, just like a real position would. Come back later or tap "Simulate next tick" to see it move.</p>
      </div>
      ${openPositions.map(renderOpenPositionCard).join("")}
    ` : ""}
    ${renderTradeStats(loggedTrades)}
    <div class="section-label">Logged trades</div>
    ${(loggedTrades.length===0 && !state.newTradeOpen) ? `
      <div class="card flat" style="margin-bottom:10px;">
        <p class="card-sub" style="margin:0;">This fills in on its own — once you open a paper trade from a Trade Plan in Analyze, it lands here automatically the moment it closes. There's nothing you need to do here yet if you haven't built one.</p>
      </div>
    ` : ""}
    ${state.newTradeOpen ? renderNewTradeForm() : `<button class="btn btn-ghost" id="openNewTrade" style="margin-bottom:14px;">+ Log a trade you made elsewhere</button>`}
    ${(openPositions.length===0 && loggedTrades.length===0) ? `
      <div class="empty-state"><div class="glyph">📝</div>Nothing here yet. Build a trade plan in Analyze and open it — it'll show up here on its own once it closes.</div>
    ` : loggedTrades.length===0 ? `
      <div class="empty-state"><div class="glyph">📝</div>No closed trades yet — your open position above will land here once it hits its stop or target.</div>
    ` : loggedTrades.map(renderTradeCard).join("")}
  `;
}

function renderOpenPositionCard(t){
  const entry = parseFloat(t.entry), stop = parseFloat(t.stop), target = parseFloat(t.target);
  const ticks = ticksElapsed(t);
  const price = simulatedPrice(t.ticker, t.entry, ticks);
  const unrealizedPct = t.direction==="short" ? ((entry-price)/entry*100) : ((price-entry)/entry*100);
  const isUp = unrealizedPct>=0;
  const low = Math.min(stop, target), high = Math.max(stop, target);
  const rangePct = high>low ? Math.max(0, Math.min(100, ((price-low)/(high-low))*100)) : 50;
  return `
    <div class="trade-card">
      <div class="row1">
        <span class="ticker">${escapeHtml(t.ticker)} <span class="badge level-current" style="margin-left:6px;">Open</span></span>
        <span class="result ${isUp?'pos':'neg'}">${isUp?'+':''}${fmt(unrealizedPct,1)}%</span>
      </div>
      <div style="font-size:12.5px; color:var(--text-muted); margin-bottom:8px;">${t.direction} · entry ${fmtMoney(entry)} · simulated price now: <b style="color:var(--text);">${fmtMoney(price)}</b></div>
      <div class="progress-track" style="margin-bottom:4px;"><div class="progress-fill" style="width:${rangePct}%; background:${isUp?'linear-gradient(90deg, var(--accent-dim), var(--accent))':'linear-gradient(90deg, #6b2430, var(--danger))'};"></div></div>
      <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-muted); margin-bottom:10px;">
        <span>Stop ${fmtMoney(stop)}</span><span>Target ${fmtMoney(target)}</span>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost btn-sm" data-ticktrade="${t.id}">⏩ Simulate next tick</button>
        <button class="btn btn-danger-outline btn-sm" data-closetrade="${t.id}">Close now</button>
      </div>
    </div>
  `;
}

function renderDecisionLog(){
  return `
    <div class="card flat">
      <p class="card-sub" style="margin:0;">Every analysis and trade action you take is captured here (in this session only). In production, this history is what lets us check whether higher-confidence reads actually performed better, and improve the coach's scoring over time.</p>
    </div>
    <div class="section-label">Captured decisions</div>
    ${state.decisionLog.length===0 ? `
      <div class="empty-state"><div class="glyph">🗂️</div>Nothing captured yet — run a stock analysis or send a plan to your journal.</div>
    ` : `<div class="card">${state.decisionLog.map(renderDecisionRow).join("")}</div>`}
  `;
}

function renderDecisionRow(d){
  return `
    <div class="decision-row">
      <div>
        <div style="font-size:13.5px; font-weight:600;">${escapeHtml(d.ticker)} — ${escapeHtml(d.action)}</div>
        <div class="dmeta">${fmtDate(d.timestamp)}${d.dataQuality ? " · data: "+d.dataQuality : ""}</div>
      </div>
      <div style="text-align:right; flex-shrink:0;">
        ${d.confidence!==null ? `<div class="mono" style="font-size:13px; font-weight:700;">${d.confidence}/100</div><div class="dmeta">${d.confidenceLabel} conf.</div>` : `<div class="dmeta">—</div>`}
      </div>
    </div>
  `;
}

function renderTradeStats(trades){
  if(trades.length===0) return "";
  const withResult = trades.filter(t=>t.resultPct!=="" && !isNaN(parseFloat(t.resultPct)));
  const wins = withResult.filter(t=>parseFloat(t.resultPct)>0);
  const losses = withResult.filter(t=>parseFloat(t.resultPct)<=0);
  const winRate = withResult.length ? Math.round((wins.length/withResult.length)*100) : 0;
  const avgGain = wins.length ? wins.reduce((a,t)=>a+parseFloat(t.resultPct),0)/wins.length : 0;
  const avgLoss = losses.length ? losses.reduce((a,t)=>a+parseFloat(t.resultPct),0)/losses.length : 0;
  const followed = trades.filter(t=>t.followedPlan==="yes").length;
  const adherence = Math.round((followed/trades.length)*100);
  const strategyCounts = {};
  trades.forEach(t=>{ if(t.strategy) strategyCounts[t.strategy]=(strategyCounts[t.strategy]||0)+1; });
  const topStrategy = Object.entries(strategyCounts).sort((a,b)=>b[1]-a[1])[0];

  return `
    <div class="section-label">My trades — overview</div>
    <div class="stat-grid">
      <div class="stat-box"><div class="num">${winRate}%</div><div class="lbl">Win rate</div></div>
      <div class="stat-box"><div class="num">${adherence}%</div><div class="lbl">Plan adherence</div></div>
      <div class="stat-box"><div class="num pos">+${fmt(avgGain,1)}%</div><div class="lbl">Avg gain</div></div>
      <div class="stat-box"><div class="num neg">${fmt(avgLoss,1)}%</div><div class="lbl">Avg loss</div></div>
    </div>
    <div class="card flat" style="margin-top:10px;">
      <div class="card-sub" style="margin:0;">Most used strategy: <b style="color:var(--text);">${topStrategy ? topStrategy[0] : "—"}</b></div>
    </div>
  `;
}

function renderTradeCard(t){
  const result = parseFloat(t.resultPct);
  const resultClass = isNaN(result) ? "" : (result>=0 ? "pos":"neg");
  return `
    <div class="trade-card">
      <div class="row1">
        <span class="ticker">${t.ticker ? escapeHtml(t.ticker) : "—"}</span>
        <span class="result ${resultClass}">${t.resultPct!=="" ? (result>=0?"+":"")+t.resultPct+"%" : "—"}</span>
      </div>
      <div style="font-size:12.5px; color:var(--text-muted); margin-bottom:8px;">${t.date ? escapeHtml(t.date) : "no date"} · ${t.direction} · ${t.strategy ? escapeHtml(t.strategy) : "no strategy tagged"}${t.closeReason ? " · " + escapeHtml(t.closeReason) : ""}</div>
      <div style="font-size:13px; color:var(--text-muted); margin-bottom:10px;">${t.reason ? escapeHtml(t.reason).slice(0,120) : ""}</div>
      <div class="btn-row">
        <button class="btn btn-ghost btn-sm" data-review="${t.id}">AI trade review</button>
      </div>
    </div>
  `;
}

      <div class="field-row">

/* ============================= AI TRADE REVIEW ============================= */

function renderReview(){
  const t = state.trades.find(x=>x.id===state.reviewTradeId);
  if(!t) return `<div class="empty-state">Trade not found.</div>`;
  const result = parseFloat(t.resultPct);
  const isWin = !isNaN(result) && result>0;
  const followedPlan = t.followedPlan === "yes";
  const hasReason = t.reason && t.reason.trim().length>10;
  const emotionalFlag = ["FOMO / excited","Frustrated / revenge"].includes(t.emotion);

  const checklist = [
    { ok: hasReason, label: "Setup matched a stated strategy/reason", detail: hasReason ? "You recorded a specific reason for the trade." : "No clear reason was recorded — that makes this trade hard to learn from either way." },
    { ok: followedPlan, label: "Risk was defined and the plan was followed", detail: followedPlan ? "You indicated you followed your plan." : "You indicated you did not follow your plan — that's the most important thing to address, regardless of the outcome." },
    { ok: !emotionalFlag, label: "Entry wasn't driven by FOMO or revenge trading", detail: emotionalFlag ? `You logged your emotional state as "${t.emotion}" — worth examining regardless of how the trade turned out.` : `Emotional state logged as "${t.emotion}" — no major red flag here.` },
  ];

  return `
    <div class="top-back">
      <button data-back="journal">←</button>
      <div class="ttl">Trade review — ${escapeHtml(t.ticker)}</div>
    </div>
    <div class="card flat">
      <p style="margin:0; font-size:14px; line-height:1.55;">Let's review this trade without judging the outcome. A ${isWin?"profitable":"losing"} trade isn't automatically a ${isWin?"good":"bad"} one — process matters more than the result.</p>
    </div>

    <div class="section-label">What happened</div>
    <div class="card">
      <div class="kv"><span class="k">Result</span><span class="v ${isWin?'pos':'neg'}">${t.resultPct!==""?(result>=0?"+":"")+t.resultPct+"%":"—"}</span></div>
      <div class="kv"><span class="k">Direction</span><span class="v">${t.direction}</span></div>
      <div class="kv"><span class="k">Strategy</span><span class="v">${t.strategy ? escapeHtml(t.strategy) : "—"}</span></div>
      <div class="kv"><span class="k">Followed plan</span><span class="v">${t.followedPlan}</span></div>
    </div>

    <div class="section-label">Process checklist</div>
    <div class="card">
      ${checklist.map(c => `
        <div class="checklist-item">
          <span class="mark ${c.ok?'yes':'no'}">${c.ok?'✓':'!'}</span>
          <div>
            <div style="font-size:13.5px; font-weight:600;">${c.label}</div>
            <div style="font-size:12.5px; color:var(--text-muted); margin-top:2px;">${c.detail}</div>
          </div>
        </div>
      `).join("")}
    </div>

    <div class="section-label">Within your control vs. not</div>
    <div class="card">
      <p style="margin:0 0 10px 0; font-size:13.5px; line-height:1.55;"><b>Within your control:</b> your entry criteria, position size, whether you honored your stop, and how closely you followed your stated plan.</p>
      <p style="margin:0; font-size:13.5px; line-height:1.55;"><b>Outside your control:</b> the actual path price took after your entry, and any news or broader market move that affected it.</p>
    </div>

    <div class="section-label">What can be learned</div>
    <div class="card" style="border-color:var(--accent-dim); background:#0f2921;">
      <p style="margin:0; font-size:14px; line-height:1.6;">${
        state.liveLoading["trade_review:"+t.id] && state.liveContent["trade_review:"+t.id]===undefined
          ? "Thinking this through…"
          : (state.liveContent["trade_review:"+t.id] || generateReviewTakeaway(t, checklist))
      }</p>
    </div>

    <button class="btn btn-ghost" data-back="journal" style="margin-top:6px;">Back to journal</button>
  `;
}

function generateReviewTakeaway(t, checklist){
  const failed = checklist.filter(c=>!c.ok);
  if(failed.length===0){
    return "This trade shows a clean process: a stated reason, a plan that was followed, and no major emotional red flags. Whatever the outcome, that's the repeatable part worth reinforcing.";
  }
  if(!checklist[1].ok){
    return "The biggest lesson here isn't about this specific ticker — it's that the plan wasn't followed. Before the next trade, it's worth asking what made it hard to stick to the plan in the moment, and whether the plan itself was realistic.";
  }
  if(!checklist[2].ok){
    return `The entry was logged under "${t.emotion}" — that's worth flagging even if the trade worked out, since that emotional state doesn't reliably produce good decisions over many trades.`;
  }
  return "Consider writing a slightly more specific reason for future trades — a clear, falsifiable thesis makes it much easier to judge whether a trade was well-reasoned, independent of the result.";
}

function fallbackCopyText(text){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand("copy"); } catch(e) {}
  document.body.removeChild(ta);
}

/* ============================= EVENT BINDING ============================= */

function bindEvents(){
  qa("[data-nav]").forEach(el => el.addEventListener("click", () => {
    const target = el.getAttribute("data-nav");
    if(el.hasAttribute("data-atab")) state.analyzeTab = el.getAttribute("data-atab");
    if(el.hasAttribute("data-jtab")) state.journalTab = el.getAttribute("data-jtab");
    go(target);
  }));

  const id = (x)=>document.getElementById(x);
  const on = (elId, evt, fn) => { const e = id(elId); if(e) e.addEventListener(evt, fn); };

  // onboarding
  on("startOb","click", ()=>{ state.obStep=1; render(); });
  qa("[data-exp]").forEach(el=>el.addEventListener("click", ()=>{ state.profile.experience = el.getAttribute("data-exp"); render(); }));
  qa("[data-goal]").forEach(el=>el.addEventListener("click", ()=>{
    const id = el.getAttribute("data-goal");
    const idx = state.profile.goals.indexOf(id);
    if(idx>-1) state.profile.goals.splice(idx,1); else state.profile.goals.push(id);
    render();
  }));
  qa("[data-risk]").forEach(el=>el.addEventListener("click", ()=>{ state.profile.riskTolerance = el.getAttribute("data-risk"); render(); }));
  qa("[data-tfpref]").forEach(el=>el.addEventListener("click", ()=>{ state.profile.timeframePref = el.getAttribute("data-tfpref"); render(); }));
  qa("[data-instrument]").forEach(el=>el.addEventListener("click", ()=>{
    const id = el.getAttribute("data-instrument");
    const idx = state.profile.instruments.indexOf(id);
    if(idx>-1) state.profile.instruments.splice(idx,1); else state.profile.instruments.push(id);
    render();
  }));
  on("obDisplayName","input", (e)=>{ state.profile.displayName = e.target.value; });
  qa("[data-avatar]").forEach(el=>el.addEventListener("click", ()=>{ state.profile.avatarEmoji = el.getAttribute("data-avatar"); render(); }));
  on("obNext","click", ()=>{
    if(ONBOARDING_STEPS[state.obStep]==="identity" && isNameTaken(state.profile.displayName)){
      showAlert(`"${state.profile.displayName.trim()}" is already used by someone in the Community leaderboard — pick a different name so you're not mixed up with them.`, "That name's taken");
      return;
    }
    state.obStep++; render();
  });
  on("obBack","click", ()=>{ if(state.obStep>0) state.obStep--; render(); });
  on("obFinish","click", ()=>{
    const defaultRisk = { conservative:"0.5", moderate:"1", aggressive:"2" }[state.profile.riskTolerance];
    if(defaultRisk) state.plan.riskPct = defaultRisk;
    if(state.profile.instruments.length && !state.profile.instruments.includes("stocks")){
      state.plan.instrument = state.profile.instruments[0];
    }
    go("home");
  });

  // home
  on("recommendedStepBtn","click", ()=>{ const rec = getRecommendedStep(); if(rec) rec.action(); });
  on("planPrereqLink","click", ()=>{
    const key = PLAN_PREREQ_TOPIC[state.plan.instrument];
    if(key){
      state.teacherTopic = key; state.teacherView = "explain"; state.reveal = false; state.learnTab = "teach";
      fetchLiveAndCache("explain", "explain:"+key, { topic: TOPICS[key].title });
      go("learn");
    }
  });
  on("dailyPromptBtn","click", ()=>{ goToNav(todaysPrompt().nav); });

  // learn subtabs
  qa("[data-ltab]").forEach(el=>el.addEventListener("click", ()=>{ state.learnTab = el.getAttribute("data-ltab"); render(); }));
  qa("[data-topic]").forEach(el=>el.addEventListener("click", ()=>{
    state.teacherTopic = el.getAttribute("data-topic");
    state.teacherView = "explain";
    state.reveal = false; state.quizIndex = 0; state.quizAnswered = null; state.quizCorrectCount = 0; state.currentQuizSession = null;
    fetchLiveAndCache("explain", "explain:"+state.teacherTopic, { topic: TOPICS[state.teacherTopic].title });
    render();
  }));
  qa("[data-tview]").forEach(el=>el.addEventListener("click", ()=>{
    state.teacherView = el.getAttribute("data-tview");
    state.reveal=false; state.quizIndex=0; state.quizAnswered=null; state.quizCorrectCount=0;
    if(state.teacherView==="quiz"){
      if(LIVE_COACH_ENABLED) fetchLiveQuiz(state.teacherTopic);
      else state.currentQuizSession = selectQuizSession(state.teacherTopic);
    }
    if(state.teacherView==="challenge") fetchLiveAndCache("challenge", "challenge:"+state.teacherTopic, { topic: TOPICS[state.teacherTopic].title });
    render();
  }));
  on("askBtn","click", ()=>{
    const val = id("askInput") ? id("askInput").value : "";
    handleFreeAsk(val);
  });
  qa("[data-reveal]").forEach(el=>el.addEventListener("click", ()=>{
    state.reveal = true;
    fetchLiveAndCache("socratic_followup", "followup:"+state.teacherTopic, {
      topic: TOPICS[state.teacherTopic].title,
      userGuess: "(this POC's reveal button doesn't collect a typed guess yet — the user tapped 'show answer')",
    });
    render();
  }));
  qa("[data-quizopt]").forEach(el=>el.addEventListener("click", ()=>{
    if(state.quizAnswered!==null) return;
    const i = parseInt(el.getAttribute("data-quizopt"));
    state.quizAnswered = i;
    const quizArr = state.liveContent["quiz:"+state.teacherTopic] || state.currentQuizSession || TOPICS[state.teacherTopic].quiz;
    const q = quizArr[state.quizIndex];
    const wasCorrect = i===q.correct;
    if(wasCorrect) state.quizCorrectCount++;
    if(q._bankIndex !== undefined){
      recordQuizAnswer(state.teacherTopic, q._bankIndex, wasCorrect); // updates the persistent per-question record immediately
    }
    render();
  }));
  on("nextQuiz","click", ()=>{ state.quizIndex++; state.quizAnswered=null; render(); });
  on("finishQuiz","click", ()=>{
    const liveArr = state.liveContent["quiz:"+state.teacherTopic];
    if(liveArr){
      // Live mode has no fixed bank, so use the simple "get this pass right" rule directly.
      const passed = state.quizCorrectCount === liveArr.length;
      recordQuizAttempt(state.teacherTopic, passed);
    }
    // Static mode already recorded progress per-question as each answer came in.
    state.teacherView = "quiz_result";
    render();
  });
  on("retryQuiz","click", ()=>{
    state.quizIndex=0; state.quizAnswered=null; state.quizCorrectCount=0; state.teacherView="quiz";
    if(LIVE_COACH_ENABLED){
      delete state.liveContent["quiz:"+state.teacherTopic]; // force a fresh live question on retry
      fetchLiveQuiz(state.teacherTopic);
    } else {
      state.currentQuizSession = selectQuizSession(state.teacherTopic); // fresh adaptive draw, prioritizing what's still wrong
    }
    render();
  });
  on("reviewExplainAgain","click", ()=>{ state.reveal=false; state.teacherView="explain"; render(); });
  on("goNextTopic","click", ()=>{
    const next = nextUnmasteredTopic(state.teacherTopic);
    if(next){
      state.teacherTopic = next; state.teacherView = "explain"; state.reveal=false; state.currentQuizSession = null;
      fetchLiveAndCache("explain", "explain:"+next, { topic: TOPICS[next].title });
    }
    render();
  });
  on("markLearned","click", ()=>{
    // find a matching level topic loosely and mark it complete for progress feel
    const t = TOPICS[state.teacherTopic];
    outer: for(const lvl of LEVELS){ for(let i=0;i<lvl.topics.length;i++){ if(t.title.toLowerCase().includes(lvl.topics[i].toLowerCase().split(" ")[0])){ state.levelsComplete[lvl.id+"-"+i]=true; break outer; } } }
    state.teacherView="menu"; state.teacherTopic=null; render();
  });
  qa("[data-back]").forEach(el=>el.addEventListener("click", ()=>{
    const b = el.getAttribute("data-back");
    if(b==="teacherMenu"){ state.teacherView="menu"; state.teacherTopic=null; render(); }
    if(b==="analyzerMenu"){ state.analysis=null; render(); }
    if(b==="journal"){ go("journal"); }
    if(b==="profileNoSave"){ state.editingProfile=null; go("profile"); }
  }));

  // edit profile
  on("openEditProfile","click", ()=>{
    state.editingProfile = JSON.parse(JSON.stringify(state.profile));
    go("editProfile");
  });
  on("editDisplayName","input", (e)=>{ state.editingProfile.displayName = e.target.value; });
  qa("[data-editavatar]").forEach(el=>el.addEventListener("click", ()=>{ state.editingProfile.avatarEmoji = el.getAttribute("data-editavatar"); render(); }));
  qa("[data-editexp]").forEach(el=>el.addEventListener("click", ()=>{ state.editingProfile.experience = el.getAttribute("data-editexp"); render(); }));
  qa("[data-editrisk]").forEach(el=>el.addEventListener("click", ()=>{ state.editingProfile.riskTolerance = el.getAttribute("data-editrisk"); render(); }));
  qa("[data-edittf]").forEach(el=>el.addEventListener("click", ()=>{ state.editingProfile.timeframePref = el.getAttribute("data-edittf"); render(); }));
  qa("[data-editgoal]").forEach(el=>el.addEventListener("click", ()=>{
    const id = el.getAttribute("data-editgoal");
    const idx = state.editingProfile.goals.indexOf(id);
    if(idx>-1) state.editingProfile.goals.splice(idx,1); else state.editingProfile.goals.push(id);
    render();
  }));
  qa("[data-editinstrument]").forEach(el=>el.addEventListener("click", ()=>{
    const id = el.getAttribute("data-editinstrument");
    const idx = state.editingProfile.instruments.indexOf(id);
    if(idx>-1) state.editingProfile.instruments.splice(idx,1); else state.editingProfile.instruments.push(id);
    render();
  }));
  on("saveEditProfile","click", ()=>{
    if(isNameTaken(state.editingProfile.displayName)){
      showAlert(`"${state.editingProfile.displayName.trim()}" is already used by someone in the Community leaderboard — pick a different name so you're not mixed up with them.`, "That name's taken");
      return;
    }
    state.profile = state.editingProfile;
    state.editingProfile = null;
    // If the Trade Plan Builder was set to an instrument the person just removed,
    // fall back to one they still have selected, so nothing gets orphaned.
    if(!state.profile.instruments.includes(state.plan.instrument)){
      state.plan.instrument = state.profile.instruments[0] || "stocks";
    }
    go("profile");
  });

  // learning path checkboxes
  qa("[data-levelkey]").forEach(el=>el.addEventListener("change", ()=>{
    state.levelsComplete[el.getAttribute("data-levelkey")] = el.checked;
    render();
  }));
  qa("[data-gotoquiz]").forEach(el=>el.addEventListener("click", ()=>{
    const key = el.getAttribute("data-gotoquiz");
    state.learnTab = "teach";
    state.teacherTopic = key;
    state.teacherView = "quiz";
    state.quizIndex = 0; state.quizAnswered = null; state.quizCorrectCount = 0;
    go("learn");
  }));

  // analyze
  qa("[data-atab]").forEach(el=>el.addEventListener("click", ()=>{ state.analyzeTab = el.getAttribute("data-atab"); render(); }));
  on("tickerInput","input", (e)=>{ state.analysisTicker = e.target.value; });
  on("analyzeBtn","click", ()=>{
    if(!state.analysisTicker.trim()){ showAlert("Enter a ticker first."); return; }
    state.analysis = generateAnalysis(state.analysisTicker, state.profile);
    state.hasAnalyzed = true;
    captureDecision({
      ticker: state.analysis.ticker,
      action: "Analyzed",
      confidence: state.analysis.confidence.score,
      confidenceLabel: state.analysis.confidence.label,
      fundamental: state.analysis.fundamentals.composite,
      dataQuality: state.analysis.dataQuality.overall,
    });
    render();
  });
  on("planFromAnalysis","click", ()=>{
    const a = state.analysis;
    state.plan.ticker = a.ticker;
    if(state.plan.instrument==='stocks' || state.plan.instrument==='futures' || state.plan.instrument==='crypto'){
      state.plan.entry = fmt(a.currentPrice, 2);
      state.plan.stop = fmt(a.supportLevel, 2);
      state.plan.target = fmt(a.resistanceLevel, 2);
    }
    state.analyzeTab = "plan";
    state.analysis = null;
    render();
  });

  // plan builder
  qa("[data-planinstrument]").forEach(el=>el.addEventListener("click", ()=>{ state.plan.instrument = el.getAttribute("data-planinstrument"); state.planResult = null; render(); }));
  qa("[data-dir]").forEach(el=>el.addEventListener("click", ()=>{ state.plan.direction = el.getAttribute("data-dir"); render(); }));
  qa("[data-opttype]").forEach(el=>el.addEventListener("click", ()=>{ state.plan.optionType = el.getAttribute("data-opttype"); render(); }));
  ["pTicker","pEntry","pStop","pTarget","pAccount","pRisk","pThesis","pStrike","pPremium","pContracts","pExpiration","pOptTargetPrice","pPointValue"].forEach(fieldId=>{
    on(fieldId,"input",(e)=>{
      const map = {pTicker:"ticker",pEntry:"entry",pStop:"stop",pTarget:"target",pAccount:"account",pRisk:"riskPct",pThesis:"thesis",
        pStrike:"strike",pPremium:"premium",pContracts:"contracts",pExpiration:"expiration",pOptTargetPrice:"targetPrice",pPointValue:"pointValue"};
      state.plan[map[fieldId]] = e.target.value;
    });
  });
  on("pTimeframe","change",(e)=>{ state.plan.timeframe = e.target.value; });
  on("calcPlan","click", ()=>{
    state.planResult = computePlan(state.plan);
    if(state.planResult && !state.planResult.error) state.hasBuiltPlan = true;
    render();
  });
  on("editPlan","click", ()=>{ state.planResult = null; render(); });
  on("logPlanTrade","click", ()=>{
    const p = state.plan;
    const r = state.planResult;
    const nt = emptyTrade();
    nt.id = Date.now();
    nt.ticker = p.ticker.toUpperCase();
    nt.date = localDateStr(new Date());
    nt.instrument = p.instrument;

    let cost = 0; // cash required up front, for the insufficient-funds check below

    if(p.instrument==='options'){
      nt.entry = p.premium; nt.exit = "";
      nt.direction = p.optionType==='call' ? "long" : "short";
      nt.strategy = `${p.optionType==='call'?'Call':'Put'} option (from trade plan)`;
      nt.status = "planned"; // no live simulation for options yet — see design reference doc
      cost = r && r.totalCost ? r.totalCost : 0;
    } else if(p.instrument==='futures'){
      nt.entry = p.entry; nt.stop = p.stop; nt.target = p.target; nt.exit = "";
      nt.direction = p.direction;
      nt.strategy = "Futures (from trade plan)";
      nt.status = "open"; nt.openedAt = new Date().toISOString(); nt.manualTicks = 0;
      // Futures margin accounting is deliberately left out of the cash balance for
      // now — risk is still calculated correctly in the plan itself (see design doc).
    } else if(p.instrument==='crypto'){
      nt.entry = p.entry; nt.stop = p.stop; nt.target = p.target; nt.exit = "";
      nt.direction = "long";
      nt.strategy = "Crypto spot (from trade plan)";
      nt.status = "open"; nt.openedAt = new Date().toISOString(); nt.manualTicks = 0;
      nt.qty = r && r.positionSize ? r.positionSize : 0;
      cost = nt.qty * parseFloat(nt.entry);
    } else {
      nt.entry = p.entry; nt.stop = p.stop; nt.target = p.target; nt.exit = "";
      nt.direction = p.direction;
      nt.strategy = "From trade plan";
      nt.status = "open"; nt.openedAt = new Date().toISOString(); nt.manualTicks = 0;
      nt.qty = r && r.positionSize ? r.positionSize : 0;
      cost = nt.direction==="short" ? 0 : nt.qty * parseFloat(nt.entry); // simplified: shorts bring cash in, not out
    }

    if(cost > state.portfolio.cash){
      showAlert(`This position costs ${fmtMoney(cost)}, but your paper trading balance is only ${fmtMoney(state.portfolio.cash)}. Reduce your position size or risk %, then recalculate.`, "Not enough paper trading cash");
      return;
    }

    if(p.instrument==='options'){
      state.portfolio.cash -= cost;
    } else if(p.instrument!=='futures'){
      if(nt.direction==='short') state.portfolio.cash += nt.qty * parseFloat(nt.entry);
      else state.portfolio.cash -= cost;
    }

    nt.reason = p.thesis;
    nt.followedPlan = "yes";
    state.trades.push(nt);
    state.hasOpenedTrade = true;
    captureDecision({
      ticker: nt.ticker,
      action: "Trade plan sent to journal",
      confidence: null,
      confidenceLabel: null,
      fundamental: null,
      dataQuality: null,
    });
    state.journalTab="trades";
    go("journal");
  });

  // journal
  on("openNewTrade","click", ()=>{ state.newTradeOpen=true; state.newTrade=emptyTrade(); render(); });
  on("cancelNewTrade","click", ()=>{ state.newTradeOpen=false; render(); });
  qa("[data-ntdir]").forEach(el=>el.addEventListener("click", ()=>{ state.newTrade.direction = el.getAttribute("data-ntdir"); render(); }));
  qa("[data-ntplan]").forEach(el=>el.addEventListener("click", ()=>{ state.newTrade.followedPlan = el.getAttribute("data-ntplan"); render(); }));
  const ntMap = {ntTicker:"ticker",ntDate:"date",ntEntry:"entry",ntExit:"exit",ntResult:"resultPct",ntStrategy:"strategy",ntReason:"reason"};
  Object.keys(ntMap).forEach(fid=>{ on(fid,"input",(e)=>{ state.newTrade[ntMap[fid]] = e.target.value; }); });
  on("ntEmotion","change",(e)=>{ state.newTrade.emotion = e.target.value; });
  on("saveNewTrade","click", ()=>{
    const t = state.newTrade;
    if(!t.ticker.trim()){ showAlert("Add a ticker before saving."); return; }
    t.id = Date.now();
    t.ticker = t.ticker.toUpperCase();
    state.trades.push({...t});
    captureDecision({ ticker: t.ticker, action: "Trade logged manually", confidence: null, confidenceLabel: null, fundamental: null, dataQuality: null });
    state.newTradeOpen = false;
    render();
  });
  qa("[data-review]").forEach(el=>el.addEventListener("click", ()=>{
    const tradeId = parseInt(el.getAttribute("data-review"));
    state.reviewTradeId = tradeId;
    const t = state.trades.find(x=>x.id===tradeId);
    if(t) fetchLiveAndCache("trade_review", "trade_review:"+tradeId, { trade: t });
    go("review");
  }));
  qa("[data-ticktrade]").forEach(el=>el.addEventListener("click", ()=>{
    const id = parseInt(el.getAttribute("data-ticktrade"));
    const t = state.trades.find(x=>x.id===id);
    if(t) t.manualTicks = (t.manualTicks||0) + 3;
    render();
  }));
  qa("[data-closetrade]").forEach(el=>el.addEventListener("click", ()=>{
    const id = parseInt(el.getAttribute("data-closetrade"));
    const t = state.trades.find(x=>x.id===id);
    if(t && t.status==="open"){
      const price = simulatedPrice(t.ticker, t.entry, ticksElapsed(t));
      closeTrade(t, price, "closed manually");
    }
    render();
  }));

  // community
  qa("[data-ctab]").forEach(el=>el.addEventListener("click", ()=>{ state.communityTab = el.getAttribute("data-ctab"); render(); }));
  on("openNewIdea","click", ()=>{ state.newIdeaOpen=true; state.newIdea={ticker:"",fact:"",interp:"",assumption:"",scenario:""}; render(); });
  on("cancelNewIdea","click", ()=>{ state.newIdeaOpen=false; render(); });
  const ciMap = {ciTicker:"ticker", ciFact:"fact", ciInterp:"interp", ciAssumption:"assumption", ciScenario:"scenario"};
  Object.keys(ciMap).forEach(fid=>{ on(fid,"input",(e)=>{ state.newIdea[ciMap[fid]] = e.target.value; }); });
  on("saveNewIdea","click", ()=>{
    const i = state.newIdea;
    if(!i.ticker.trim() || !i.fact.trim() || !i.interp.trim() || !i.assumption.trim() || !i.scenario.trim()){
      showAlert("Fill in all five fields — ticker plus all four framework parts.", "Almost there");
      return;
    }
    state.communityIdeas.push({
      id: Date.now(), author:`${userAvatar()} ${userDisplayName()}`, ticker: i.ticker.toUpperCase(), timestamp: new Date().toISOString(),
      fact: i.fact, interp: i.interp, assumption: i.assumption, scenario: i.scenario, comments: []
    });
    state.newIdeaOpen = false;
    render();
  });
  qa("[data-addcomment]").forEach(el=>el.addEventListener("click", ()=>{
    const ideaId = parseInt(el.getAttribute("data-addcomment"));
    const input = id("comment-"+ideaId);
    const text = input ? input.value.trim() : "";
    if(!text) return;
    const idea = state.communityIdeas.find(x=>x.id===ideaId);
    if(idea) idea.comments.push({ author:`${userAvatar()} ${userDisplayName()}`, text });
    render();
  }));

  // alerts
  on("openNewAlert","click", ()=>{ state.newAlertOpen=true; state.newAlert=emptyAlert(); render(); });
  on("cancelNewAlert","click", ()=>{ state.newAlertOpen=false; render(); });
  const alMap = {alTicker:"ticker", alLevel:"level", alNote:"note"};
  Object.keys(alMap).forEach(fid=>{ on(fid,"input",(e)=>{ state.newAlert[alMap[fid]] = e.target.value; }); });
  on("alType","change",(e)=>{ state.newAlert.type = e.target.value; });
  on("saveNewAlert","click", ()=>{
    const a = state.newAlert;
    if(!a.ticker.trim()){ showAlert("Add a ticker before saving."); return; }
    a.id = Date.now();
    a.ticker = a.ticker.toUpperCase();
    a.createdAt = new Date().toISOString();
    a.status = "active";
    state.alerts.push({...a});
    state.newAlertOpen = false;
    render();
  });
  qa("[data-trigger]").forEach(el=>el.addEventListener("click", ()=>{
    const id = parseInt(el.getAttribute("data-trigger"));
    const a = state.alerts.find(x=>x.id===id);
    if(a){ a.status="triggered"; a.triggeredAt = new Date().toISOString(); }
    render();
  }));
  qa("[data-delalert]").forEach(el=>el.addEventListener("click", ()=>{
    const id = parseInt(el.getAttribute("data-delalert"));
    state.alerts = state.alerts.filter(x=>x.id!==id);
    render();
  }));

  // profile / feedback
  qa("[data-star]").forEach(el=>el.addEventListener("click", ()=>{ state.feedback.stars = parseInt(el.getAttribute("data-star")); render(); }));
  on("fbNote","input",(e)=>{ state.feedback.note = e.target.value; });
  qa("[data-pay]").forEach(el=>el.addEventListener("click", ()=>{ state.feedback.pay = el.getAttribute("data-pay"); render(); }));
  qa("[data-payfor]").forEach(el=>el.addEventListener("click", ()=>{ state.feedback.payFor = el.getAttribute("data-payfor"); render(); }));
  on("submitFeedback","click", ()=>{ state.feedback.submitted = true; render(); });
  on("copySessionReport","click", ()=>{
    const text = buildSessionReport();
    const finish = () => { state.reportCopied = true; render(); setTimeout(()=>{ state.reportCopied=false; render(); }, 4000); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(finish).catch(()=>{ fallbackCopyText(text); finish(); });
    } else {
      fallbackCopyText(text);
      finish();
    }
  });
  on("downloadSessionReport","click", ()=>{
    const text = buildSessionReport();
    const blob = new Blob([text], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "trading-coach-session-report.txt";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
  on("resetBtn2","click", ()=>{
    showConfirm("This clears your profile, journal, progress, and paper trading balance. This can't be undone.", resetDemo, "Reset all demo data?");
  });
}

function qa(sel){ return Array.from(document.querySelectorAll(sel)); }

async function handleFreeAsk(text){
  const q = (text||"").toLowerCase();
  const match = Object.entries(TOPICS).find(([key,t]) => (t.keywords||[]).some(kw => q.includes(kw)));
  if(match){
    state.teacherTopic = match[0];
    state.teacherView = "explain";
    state.reveal=false;
    fetchLiveAndCache("explain", "explain:"+match[0], { topic: TOPICS[match[0]].title });
    render();
    return;
  }
  if(!text || !text.trim()){ return; }
  if(state.freeAskLoading) return; // already waiting on a response — ignore duplicate taps
  if(!LIVE_COACH_ENABLED){
    // generic fallback grounded in the FACT -> INTERPRETATION -> ASSUMPTION -> SCENARIO framework
    showAlert("In the full product this would go to a live AI model. For this POC, try one of the listed topics — Support & resistance, Risk management, Candlesticks, Momentum & volume, or FOMO & revenge trading — to see the teaching experience in action.", "Coach");
    return;
  }
  state.freeAskLoading = true;
  state.freeAskAnswer = null;
  render();
  const answer = await askCoach("free_ask", { question: text });
  state.freeAskLoading = false;
  if(answer === null){
    showAlert("Couldn't reach the live coach right now. Try one of the listed topics instead.", "Coach");
  } else {
    state.freeAskAnswer = answer;
  }
  render();
}

/* ============================= INIT ============================= */
const savedAppState = loadPersistedState();
if(savedAppState && savedAppState.profile && savedAppState.profile.experience){
  Object.assign(state, savedAppState);
  state.screen = "home"; // never resume into a mid-flow screen like a form or review
}
state.streakData = updateStreakOnLoad();
render();
</script>
